{extend name="base" /}
{block name="main"}

<div class="container Wauto">
    <div class="main w1200">
        <div class="article w1">
            <div class="archive-top anim fadeInUp">
                <div class="archive-title">
                    <h1 itemprop="headline">{$tag} </h1>
                    <span></span></div>

            </div>

            <div class="post list">
                <div class="PostShow">
                    <ul>
                        {bd:list scode="*" page="1"}
                        <li data-id="{$list.id}" class="anim fadeInUp">
                            <div class="post-img loading"> <a class="pic float-left" href="{$list.link}"
                                title="{$list.title}" rel="bookmark">
                                <div class="msk"></div>
                                <i class="fa fa-search"></i>
                                <img class="b-lazy" src="{$list.image}"
                                    data-src="{$list.image}" alt="{$list.title}" /> </a> </div>
                            <h4><a href="{$list.link}" title="{$list.title}">{$item.title}</a></h4>
                            <i>	{$list.description}</i>
                        </li>
                        {/bd:list}
                    </ul>
                </div>
                <div class="clearfix"></div>
            </div>

        </div>
        <div class="text-center">{$page.bar |raw}</div>
    </div>
</div>
<script>
    $('.header').removeClass('opaque').addClass('noOpaque')
</script>
{/block}
