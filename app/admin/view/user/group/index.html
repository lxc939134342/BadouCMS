{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table
            class="layui-hide"
            id="user_group"
            data-operate-edit="{:$auth->check('user.group/edit')}"
            data-operate-del="{:$auth->check('user.group/del')}"></table>
    </div>
</div>

<!-- 表格左侧按钮 toolbar  -->
<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn  btn-refresh layui-bg-black	">
        <i class="fa fa-refresh"></i>
    </a>
    <button class="layui-btn layui-bg-green {:$auth->check('user.group/add')?'':'hide'}" lay-event="add">
        <i class="fa fa-plus"></i>
        {:__('Add')}
    </button>
    <button
        class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('user.group/edit')?'':'hide'}"
        lay-event="edit">
        <i class="fa fa-pencil"></i>
        {:__('Edit')}
    </button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('user.group/del')?'':'hide'}" lay-event="del">
        <i class="fa fa-trash"></i>
        {:__('Del')}
    </button>
</script>

<script>
    layui.use(["badou"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        var layer = layui.layer;
        var dropdown = layui.dropdown;
        bdTable.api.init({
            table: table,
            extend: {
                index_url: "user.group/index",
                add_url: "user.group/add",
                edit_url: "user.group/edit",
                del_url: "user.group/del",
                multi_url: "user.group/multi",
                table: "user_group",
            },
        });
        bdTable.render({
            elem: "#user_group",
            url: "{:url('user.group/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            cols: [
                [
                    { type: "checkbox" },
                    { field: "id", title: "ID", width: 80, sort: true },
                    { field: "name", title: __("Name") },
                    {
                        field: "create_time",
                        title: __("Createtime"),
                        templet: bdTable.api.formatter.datetime,
                        operate: "RANGE",
                        searchType: "time",
                    },
                    {
                        field: "update_time",
                        title: __("Updatetime"),
                        templet: bdTable.api.formatter.datetime,
                        operate: "RANGE",
                        searchType: "time",
                    },
                    {
                        field: "status",
                        title: "状态",
                        width: 100,
                        searchList: { normal: "正常", hidden: "隐藏" },
                        custom: { normal: "green", hidden: "orange" },
                        templet: bdTable.api.formatter.status,
                    },
                    { title: "操作", width: 190, align: "center", templet: bdTable.api.formatter.operate },
                ],
            ],
        });
    });
</script>
