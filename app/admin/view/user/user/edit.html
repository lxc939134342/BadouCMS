{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Group')}</label>
        <div class="layui-input-block">
            <select name="row[pid]" lay-verify="required">
                {foreach name="$groupdata"  item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Username')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[username]" value="{$row.username}" lay-verify="required" autocomplete="off"  placeholder="{:__('Username')}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Nickname')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[nickname]" value="{$row.nickname}" lay-verify="required" autocomplete="off" placeholder="{:__('Nickname')}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Password')}</label>
        <div class="layui-input-block">
            <input type="password" name="row[password]" value="" autocomplete="off" placeholder="{:__('Leave password blank if dont want to change')}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Email')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[email]" value="{$row.email}" lay-verify="" autocomplete="off" placeholder="{:__('Email')}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Mobile')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[mobile]" value="{$row.mobile}" lay-verify="" autocomplete="off" placeholder="{:__('Mobile')}" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Avatar')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[avatar]" value="{$row.avatar}" lay-verify="" autocomplete="off" placeholder="{:__('Avatar')}" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Level')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[level]" value="{$row.level}" lay-verify="" autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Gender')} </label>
        <div class="layui-input-block">
            <input type="radio" name="row[gender]" value="1" title="{:__('Male')}" {if $row.gender=='1'}checked{/if}>
            <input type="radio" name="row[gender]" value="0" title="{:__('FeMale')}" {if $row.gender=='0'}checked{/if}>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Birthday')} </label>
        <div class="layui-input-block">
            <input lay-verify="" class="layui-input datetimepicker" name="row[birthday]" type="text" value="{$row.birthday}">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Bio')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[bio]" value="{$row.bio}" lay-verify="" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Money')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[money]" value="{$row.money}" lay-verify="" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Score')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[score]" value="{$row.score}" lay-verify="" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Successions')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[successions]" value="{$row.successions}" lay-verify="" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Maxsuccessions')}</label>
        <div class="layui-input-block">
            <input type="number" name="row[maxsuccessions]" value="{$row.maxsuccessions}" lay-verify="" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Prevtime')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[prevtime]" value="{$row.prevtime}" lay-verify="" autocomplete="off" class="layui-input datetimepicker">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Loginip')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[loginip]" value="{$row.loginip}" lay-verify="" autocomplete="off" class="layui-input datetimepicker">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Loginfailure')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[loginfailure]" value="{$row.loginfailure}" lay-verify="" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Joinip')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[joinip]" value="{$row.joinip}" lay-verify="" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">{:__('Jointime')}</label>
        <div class="layui-input-block">
            <input type="text" name="row[jointime]" value="{$row.jointime}" lay-verify="" autocomplete="off" class="layui-input datetimepicker">
        </div>
    </div>


    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn pear-btn-primary layui-btn-sm disabled" lay-submit>立即提交</button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">重置</button>
        </div>
    </div>
</form>

<script>
    layui.use(['badou'],function () {
        var bdForm = layui.bdForm;


        //日期选择器
        laydate.render({
            elem: '.datetimepicker'
            //,type: 'date' //默认，可不填
        });


        bdForm.api.bindevent($("form.layui-form"));
    })
</script>
