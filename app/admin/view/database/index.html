{layout name="layout/default" /}

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="database"></table>
    </div>
</div>
<!-- 表格左侧按钮 toolbar  -->
<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black	">
        <i class="fa fa-refresh"></i>
    </a>
    <a class="layui-btn layui-bg-blue btn-dialog" href="{:url('database/backuplist')}" data-area='["80%","80%"]'>
        <i class="fa fa-database"></i>
        {:__('Backup removal')}
    </a>
    <a class="layui-btn layui-bg-green btn-ajax" href="{:url('database/optimize')}">
        <i class="fa fa-database"></i>
        {:__('Optimize table')}
    </a>
    <a class="layui-btn layui-bg-orange btn-ajax" href="{:url('database/repair')}">
        <i class="fa fa-database"></i>
        {:__('Repair table')}
    </a>
</script>
<script>
    layui.use(["badou", "table"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        var layer = layui.layer;
        var dropdown = layui.dropdown;
        bdTable.api.init({
            table: table,
            extend: {
                index_url: "database/index",
                table: "database",
            },
        });
        bdTable.render({
            elem: "#database",
            url: "{:url('database/index')}",
            pk: "id",
            even: true,
            page: true,
            commonSearch: false,
            defaultToolbar: [],
            toolbar: "#toolbar",
            cols: [
                [
                    { type: "checkbox" },
                    { field: "id", title: __("ID"), width: 80, sort: true },
                    { field: "name", title: __("Name"), width: 300 },
                    { field: "engine", title: __("Engine"), width: 180 },
                    { field: "charset", title: __("Charset"), operate: "LIKE" },
                    { field: "collation", title: __("Collation"), width: 220 },
                    { field: "rows", title: __("Rows"), width: 120 },
                    {
                        field: "create_time",
                        title: __("Create time"),
                        width: 200,
                        templet: bdTable.api.formatter.datetime,
                        searchType: "time",
                    },
                    {
                        field: "update_time",
                        title: __("Update time"),
                        width: 200,
                        templet: bdTable.api.formatter.datetime,
                        searchType: "time",
                    },
                ],
            ],
            done: function () {
                $(".btn-ajax").data("success", function () {
                    $(".btn-refresh").trigger("click");
                });
            },
        });
    });
</script>
