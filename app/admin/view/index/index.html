<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
        <title>主页</title>
        {include file="common/meta" }
    </head>
    <!-- 结 构 代 码 -->
    <body class="layui-layout-body pear-admin">
        <!-- 布 局 框 架 -->
        <div class="layui-layout layui-layout-admin">
            <!-- 顶 部 样 式 -->
            <div class="layui-header">
                <!-- 菜 单 顶 部 -->
                <div class="layui-logo">
                    <!-- 图 标 -->
                    <img class="logo" />
                    <!-- 标 题 -->
                    <span class="title"></span>
                </div>
                <!-- 顶 部 左 侧 功 能 -->
                <ul class="layui-nav layui-layout-left">
                    <li class="collapse layui-nav-item"><a href="#" class="layui-icon layui-icon-shrink-right"></a></li>
                    <li class="refresh layui-nav-item"><a href="#" class="layui-icon layui-icon-refresh-1" loading="600"></a></li>
                </ul>
                <!-- 多 系 统 菜 单 -->
                <div id="control" class="layui-layout-control"></div>
                <!-- 顶 部 右 侧 菜 单 -->
                <ul class="layui-nav layui-layout-right">
                    <li class="layui-nav-item layui-hide-xs"><a href="#" class="menuSearch layui-icon layui-icon-search"></a></li>
                    <li class="layui-nav-item layui-hide-xs"><a href="#" class="fullScreen layui-icon layui-icon-screen-full"></a></li>
                    <li class="layui-nav-item">
                        <a href="javascript:;" class="layui-icon layui-icon-delete" style="font-size: 19px"></a>
                        <!-- 功 能 菜 单 -->
                        <dl class="layui-nav-child">
                            <dd><a href="javascript:void(0);" class="wipecache" data-type="all">一键清理缓存</a></dd>
                            <dd><a href="javascript:void(0);" class="wipecache" data-type="data">清除内容缓存</a></dd>
                            <dd><a href="javascript:void(0);" class="wipecache" data-type="template">清除模板缓存</a></dd>
                            <!--							<dd><a href="javascript:void(0);" class="wipecache" data-type="addons">清除插件缓存</a></dd>-->
                            <dd><a href="javascript:void(0);" class="wipecache" data-type="browser">清除浏览器缓存</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item layui-hide-xs message"></li>
                    <li class="layui-nav-item user">
                        <!-- 头 像 -->
                        <a class="layui-icon layui-icon-username" href="javascript:;"></a>
                        <!-- 功 能 菜 单 -->
                        <dl class="layui-nav-child">
                            <dd><a user-menu-url="view/system/person.html" user-menu-id="5555" user-menu-title="基本资料">基本资料</a></dd>
                            <dd><a href="javascript:void(0);" class="logout">注销登录</a></dd>
                        </dl>
                    </li>
                    <!-- 主 题 配 置 -->
                    <li class="layui-nav-item setting"><a href="#" class="layui-icon layui-icon-more-vertical"></a></li>
                </ul>
            </div>
            <!-- 侧 边 区 域 -->
            <div class="layui-side layui-bg-black">
                <!-- 菜 单 顶 部 -->
                <div class="layui-logo">
                    <!-- 图 标 -->
                    <img class="logo" />
                    <!-- 标 题 -->
                    <span class="title"></span>
                </div>
                <!-- 菜 单 内 容 -->
                <div class="layui-side-scroll">
                    <div id="sideMenu"></div>
                </div>
            </div>
            <!-- 视 图 页 面 -->
            <div class="layui-body">
                <!-- 内 容 页 面 -->
                <div id="content"></div>
            </div>
            <!-- 页脚 -->
            <div class="layui-footer layui-text">
                <span class="left"> Released under the MIT license. </span>
                <span class="center"></span>
                <span class="right"> Copyright © 2021-2022 pearadmin.com </span>
            </div>
            <!-- 遮 盖 层 -->
            <div class="pear-cover"></div>
            <!-- 加 载 动 画 -->
            <div class="loader-main">
                <!-- 动 画 对 象 -->
                <div class="loader"></div>
            </div>
        </div>
        <!-- 移 动 端 便 捷 操 作 -->
        <div class="pear-collapsed-pe collapse">
            <a href="#" class="layui-icon layui-icon-shrink-right"></a>
        </div>

        <!-- 框 架 初 始 化 -->
        <script>
            layui.use(["admin", "jquery", "popup", "drawer", "badou", "toast"], function () {
                var $ = layui.jquery;
                var admin = layui.admin;
                var popup = layui.popup;
                var Badou = layui.badou;
                var toast = layui.toast;

                admin.setConfigPath(Config.app_url + "/index/adminConfig");

                admin.render();

                //清除缓存
				$(".wipecache").on('click',function(){
					var type = $(this).data('type')
					Badou.api.ajax({
						url:"{:url('ajax/wipecache')}",
						data:{
							type:type
						}
					})
				});

                // 登出逻辑
                admin.logout(function () {
                    Badou.api.ajax(
                        {
                            url: "{:url('index/logout')}",
                        },
                        function (ret, res) {
                            toast.success({
                                message: res.msg,
                                timeout: 500,
                                onClosing: function () {
                                    location.href = res.url;
                                },
                            });
                            return false;
                        },
                        function (ret, res) {
                            toast.error({
                                message: res.msg,
                                timeout: 500,
                                onClosing: function () {
                                    location.href = res.url;
                                },
                            });
                            return false;
                        }
                    );
                    // 注销逻辑 返回 true / false
                    return true;
                });

                // 消息点击回调
                admin.message(function (id, title, context, form) {});
            });
        </script>
    </body>
</html>
