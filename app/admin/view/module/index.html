{layout name="layout/default" /}

<!-- 头部 -->
<div class="layui-card">
    <div class="layui-card-body">
        <a href="javascript:;" lay-event="refresh" class="layui-btn layui-btn-sm btn-refresh layui-bg-black	"><i class="fa fa-refresh"></i></a>
        <button class="layui-btn layui-btn-sm layui-bg-green" lay-event="add"><i class="fa fa-plus"></i> {:__('All')}</button>
        <button class="layui-btn layui-btn-sm layui-bg-red"><i class="fa fa-user"></i> {:__('BADOU 会员登录')}</button>
    </div>
</div>
<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <div id="modules-wrapper"></div>
    </div>
</div>

<script>
    layui.use(["badou", "card","form"], function () {
        var bdTable = layui.bdTable;
        var card = layui.card;
        var form = layui.form;

        card.render({
            elem: "#modules-wrapper",
            url: "{:url('module/index')}", // 接口数据
            data: [], // 静态数据
            page: true, // 是否分页
            limit: 8, // 每页数量
            linenum: 4, // 每行数量
            response: {
                statusCode:1,
            },
            clickItem: function (data) {
                // 单击事件
                console.log(data);
            },
        });

        // 监听搜索操作
        form.on("submit(data-search-btn)", function (data) {
            queryJson = data.field;
            card.reload("currentTableId", {
                where: queryJson,
            });
            return false;
        });
        form.on("submit(data-checked-btn)", function () {
            var data = card.getChecked("currentTableId");
            layer.msg(JSON.stringify(data));
            return false;
        });
        form.on("submit(data-btn)", function () {
            var data = card.getAllData("currentTableId");
            layer.msg(JSON.stringify(data));
            return false;
        });
    });
</script>
