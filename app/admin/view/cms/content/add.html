{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}
    <div class="layui-row layui-col-space20">
        <div class="layui-col-xs8">
            <div class="layui-form-item">
                <label class="layui-form-label">
                    栏目
                    <span class="layui-font-red">*</span>
                </label>
                <div class="layui-input-block">
                    <input type="hidden" id="c-scode" name="row[scode]" value="" class="layui-input" />
                    <div
                        class="remoteSelect"
                        id="remoteSelect-scode"
                        data-input-id="c-scode"
                        data-primary-key="scode"
                        data-field="name"
                        data-source="cms.contentsort/selectpage"
                        data-is-tree="true"
                        data-pidname="pcode"
                        data-params='{"acode":"{$acode}","mcode":"{$mcode}"}'></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">标题</label>
                <div class="layui-input-block">
                    <input
                        type="text"
                        name="row[title]"
                        lay-verify="required"
                        autocomplete="off"
                        value=""
                        placeholder="标题"
                        class="layui-input" />
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">缩略图</label>
                <div class="layui-input-block">
                    <div class="layui-input-group" style="width: 100%">
                        <input
                            type="text"
                            id="c-ico"
                            name="row[ico]"
                            class="layui-input"
                            value="" />
                        <div class="layui-input-suffix" style="width: 30%">
                            <button
                                type="button"
                                data-input-id="c-ico"
                                data-preview-id="p-ico"
                                class="layui-btn btn-bdupload">
                                <i class="fa fa-upload"></i>
                                上传
                            </button>
                            <button type="button" data-input-id="c-ico" class="layui-btn layui-bg-green btn-bdchoose">
                                <i class="fa fa-list"></i>
                                选择
                            </button>
                        </div>
                    </div>

                    <div class="layui-upload-list" id="p-ico"></div>
                </div>
            </div>

            {include file="cms/common/builder/fields" /}

            <div class="layui-form-item">
                <label class="layui-form-label">内容</label>
                <div class="layui-input-block">
                    <textarea class="layui-textarea editor" name="row[content]" rows="5"></textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">tags</label>
                <div class="layui-input-block">
                    <input
                        type="text"
                        name="row[tags]"
                        placeholder="请输入文章tag，英文逗号隔开"
                        value=""
                        class="layui-input" />
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">作者</label>
                <div class="layui-input-block">
                    <input
                        type="text"
                        name="row[author]"
                        placeholder="请输入作者"
                        value=""
                        class="layui-input" />
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">来源</label>
                <div class="layui-input-block">
                    <input
                        type="text"
                        name="row[source]"
                        placeholder="请输入来源"
                        value=""
                        class="layui-input" />
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">轮播多图</label>
                <div class="layui-input-block">
                    <div class="layui-input-group" style="width: 100%">
                        <input
                            type="text"
                            id="c-pics"
                            name="row[pics]"
                            class="layui-input"
                            value="" />
                        <div class="layui-input-suffix" style="width: 30%">
                            <button
                                type="button"
                                data-input-id="c-pics"
                                data-preview-id="p-pics"
                                data-multiple="true"
                                class="layui-btn btn-bdupload">
                                <i class="fa fa-upload"></i>
                                上传
                            </button>
                            <button type="button" data-input-id="c-pics" data-multiple="true" class="layui-btn layui-bg-green btn-bdchoose">
                                <i class="fa fa-list"></i>
                                选择
                            </button>
                        </div>
                    </div>

                    <div class="layui-upload-list" id="p-pics"></div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-block">
                    <input type="radio" name="row[status]" checked value="1" title="显示"> <input type="radio" name="row[status]" value="0" title="隐藏">
                </div>
            </div>
        </div>
        <div class="layui-col-xs4">
            <div class="layui-card layui-bg-gray">
                <div class="layui-card-header">高级内容</div>
                <div class="layui-card-body">
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            副栏目
                        </label>
                        <div class="layui-input-block">
                            <input
                                type="hidden"
                                id="c-subscode"
                                name="row[subscode]"
                                value=""
                                class="layui-input" />
                            <div
                                class="remoteSelect"
                                id="remoteSelect-subscode"
                                data-input-id="c-subscode"
                                data-primary-key="scode"
                                data-field="name"
                                data-source="cms.contentsort/selectpage"
                                data-is-tree="true"
                                data-pidname="pcode"
                                data-multiple="true"
                                data-params='{"acode":"{$acode}","mcode":"{$mcode}"}'></div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">标题颜色</label>

                        <div class="layui-input-inline">
                            <input
                                type="text"
                                name="row[titlecolor]"
                                value=""
                                placeholder="请选择标题颜色"
                                class="layui-input"
                                id="titlecolor" />
                        </div>
                        <div class="layui-inline" style="left: -11px">
                            <div class="colorpicker" data-input-id="titlecolor"></div>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">副标题</label>
                        <div class="layui-input-block">
                            <input
                                type="text"
                                name="row[subtitle]"
                                value=""
                                placeholder="请输入副标题"
                                class="layui-input" />
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">时间</label>
                        <div class="layui-input-block">
                            <input
                                type="text"
                                name="row[date]"
                                value="{:date('Y-m-d H:i:s')}"
                                readonly
                                placeholder="请选择发布时间"
                                class="layui-input laydate" />
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">附件</label>
                        <div class="layui-input-block">
                            <div class="layui-input-group" style="width: 100%">
                                <input
                                    type="text"
                                    id="c-enclosure"
                                    name="row[enclosure]"
                                    class="layui-input"
                                    value="" />
                                <div class="layui-input-suffix" style="width: 50%">
                                    <button type="button" data-input-id="c-enclosure" class="layui-btn btn-bdupload">
                                        <i class="fa fa-upload"></i>
                                        上传
                                    </button>
                                    <button
                                        type="button"
                                        data-input-id="c-enclosure"
                                        class="layui-btn layui-bg-green btn-bdchoose">
                                        <i class="fa fa-list"></i>
                                        选择
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">SEO关键字</label>
                        <div class="layui-input-block">
                            <input
                                type="text"
                                name="row[keywords]"
                                value=""
                                placeholder="请输入详情页SEO关键字"
                                class="layui-input" />
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">SEO描述</label>
                        <div class="layui-input-block">
                            <textarea name="row[description]" placeholder="请输入详情页SEO描述" class="layui-textarea">
</textarea
                            >
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn pear-btn-primary layui-btn-sm disabled" lay-submit>保存</button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">重置</button>
        </div>
    </div>
</form>

<script>
    layui.use(["badou"], function () {
        var bdForm = layui.bdForm;

        bdForm.api.bindevent($("form.layui-form"));
    });
</script>
