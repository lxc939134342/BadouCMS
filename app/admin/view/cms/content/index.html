{layout name="layout/default" /}

<div class="layui-card">
    <div class="layui-card-body">
        <table class="layui-hide" id="content" data-operate-edit="{:$auth->check('cms.content/edit')}" data-operate-del="{:$auth->check('cms.content/del')}"></table>
    </div>
</div>
<!-- 表格左侧按钮 toolbar  -->
<script type="text/html" id="toolbar">
	<a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black	"><i class="fa fa-refresh"></i></a>
	<button class="layui-btn layui-bg-green" lay-event="add"><i class="fa fa-plus"></i> {:__('Add')}</button>
	<button class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('cms.content/edit')?'':'hide'}" lay-event="edit"><i class="fa fa-pencil"></i> {:__('Edit')}</button>
	<button class="layui-btn layui-bg-red btn-disabled disabled" lay-event="del"><i class="fa fa-trash"></i> {:__('Del')}</button>
</script>
<script>
    layui.use(["badou"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        var layer = layui.layer;
        var dropdown = layui.dropdown;
        bdTable.api.init({
            table: table,
            extend: {
                index_url: "cms.content/index",
                add_url: "cms.content/add",
                edit_url: "cms.content/edit",
                del_url: "cms.content/del",
                multi_url: "cms.content/multi",
                table: "auth_rule",
            },
        });
        bdTable.render({
            elem: "#content",
            url: "{:url('cms.content/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page:true,
            cols: [
                [
                    { type: "checkbox" },
                    { field: "id", title: "ID", width: 80, sort: true },
                    { field: "scode", hide:true, title: __('Scode'), width: 90,operate:false  },
                    { field: "contentsort.name", title: __('Scode name'), width: 150 },
                    { field: "title", title:__('Title') },
                    { field: "date", title:__('Release time'), width: 180 },
                    {
                        field: "status",
                        title: __('Status'),
                        width: 100,
                        searchList: {0:__('Off'),1:__('On')},
                        templet: bdTable.api.formatter.switch,
                    },
                    { field: "visits", title: __('Visits') ,width: 80 },
                    { title: __('Operate'), align: "center",width: 200, templet: bdTable.api.formatter.operate},
                ],
            ],
        });
    });
</script>
