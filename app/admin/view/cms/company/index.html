{layout name="layout/default" /}

<script src="__CDN__/assets/cms/js/change_lang.js"></script>
<style>
    #tabsHeader .test-item {
        display: none;
    }
    .layui-form-label{
        width: 120px;
    }
    .layui-input-block{
        margin-left: 150px;
    }
</style>
<div class="layui-card">
    <div class="layui-card-body">
        <div class="layui-btn-container" id="tabsHeader">
            <button class="layui-btn layui-btn-primary layui-border-black" id="changeLang">
                <span class="lang-title">{$area_title}</span>
                <i class="layui-icon layui-icon-down layui-font-12"></i>
            </button>
            <button class="layui-btn layui-btn-primary">公司信息</button>
        </div>
        <div class="layui-panel layui-padding-3" id="tabsBody">
            <form class="layui-form" action="{:url('cms.company/edit')}" method="post">
                {:token_field()}
                <div class="layui-form-item">
                    <label class="layui-form-label">公司名称</label>
                    <div class="layui-input-block">
                        <input
                            type="text"
                            name="row[name]"
                            value="{$row.name}"
                            placeholder="请输入公司名称"
                            autocomplete="off"
                            class="layui-input" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">公司地址</label>
                    <div class="layui-input-block">
                        <input
                            type="text"
                            name="row[address]"
                            value="{$row.address}"
                            placeholder="请输入公司地址"
                            autocomplete="off"
                            class="layui-input" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">邮政编码</label>
                    <div class="layui-input-block">
                        <input
                            type="text"
                            name="row[postcode]"
                            value="{$row.postcode}"
                            placeholder="请输入邮政编码"
                            autocomplete="off"
                            class="layui-input" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">公司联系人</label>
                    <div class="layui-input-block">
                        <input
                            type="text"
                            name="row[contact]"
                            value="{$row.contact}"
                            placeholder="请输入公司联系人"
                            autocomplete="off"
                            class="layui-input" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">手机号码</label>
                    <div class="layui-input-block">
                        <input
                            type="text"
                            name="row[mobile]"
                            value="{$row.mobile}"
                            placeholder="请输入手机号码"
                            autocomplete="off"
                            class="layui-input" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">电话号码</label>
                    <div class="layui-input-block">
                        <input
                            type="text"
                            name="row[phone]"
                            value="{$row.phone}"
                            placeholder="请输入电话号码"
                            autocomplete="off"
                            class="layui-input" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">公司传真</label>
                    <div class="layui-input-block">
                        <input
                            type="text"
                            name="row[fax]"
                            value="{$row.fax}"
                            placeholder="请输入公司传真"
                            autocomplete="off"
                            class="layui-input" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">电子邮箱</label>
                    <div class="layui-input-block">
                        <input
                            type="text"
                            name="row[email]"
                            value="{$row.email}"
                            placeholder="请输入电子邮箱"
                            autocomplete="off"
                            class="layui-input" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">公司QQ</label>
                    <div class="layui-input-block">
                        <input
                            type="text"
                            name="row[qq]"
                            value="{$row.qq}"
                            placeholder="请输入公司QQ"
                            autocomplete="off"
                            class="layui-input" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">微信图标</label>
                    <div class="layui-input-block">
                        <input type="text" id="c-weixin" name="row[weixin]" class="layui-input" value="{$row.weixin}" />
                        <div class="layui-input-suffix" style="width: 30%">
                            <button
                                type="button"
                                data-input-id="c-weixin"
                                data-preview-id="p-weixin"
                                class="layui-btn btn-bdupload">
                                <i class="fa fa-upload"></i>
                                上传
                            </button>
                            <button
                                type="button"
                                data-input-id="c-weixin"
                                class="layui-btn layui-bg-green btn-bdchoose">
                                <i class="fa fa-list"></i>
                                选择
                            </button>
                        </div>
                        <div class="layui-upload-list" id="p-weixin"></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">营业执照代码</label>
                    <div class="layui-input-block">
                        <input
                            type="text"
                            name="row[blicense]"
                            value="{$row.blicense}"
                            placeholder="请输入营业执照代码"
                            autocomplete="off"
                            class="layui-input" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">其他信息</label>
                    <div class="layui-input-block">
                        <input
                            type="text"
                            name="row[other]"
                            value="{$row.other}"
                            placeholder="请输入其他信息"
                            autocomplete="off"
                            class="layui-input" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button class="layui-btn btn-theme-color" lay-submit>保存</button>
                        <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    layui.use(["badou", "changeLang"], function () {
        var bdForm = layui.bdForm;
        var changeLang = layui.changeLang;
        var tabs = layui.tabs;

        changeLang({});
        bdForm.api.bindevent($("form.layui-form"));

        // 给任意元素绑定 Tab 功能
        tabs.render({
            elem: "#demoTabs3",
            header: ["#tabsHeader", ">button"],
            body: ["#tabsBody", ">.test-item"],
        });
    });
</script>
