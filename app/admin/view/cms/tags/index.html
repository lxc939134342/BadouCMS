{layout name="layout/default" /}
<script src="__CDN__/assets/cms/js/change_lang.js"></script>

<!-- 表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table
            class="layui-hide"
            id="tags"
            data-operate-edit="{:$auth->check('cms.tags/edit')}"
            data-operate-del="{:$auth->check('cms.tags/del')}"></table>
    </div>
</div>
<!-- 表格左侧按钮 toolbar  -->
<script type="text/html" id="toolbar">
    <a href="javascript:;" lay-event="refresh" class="layui-btn btn-refresh layui-bg-black	">
        <i class="fa fa-refresh"></i>
    </a>
    <button class="layui-btn layui-btn-primary layui-border-black" id="changeLang">
        <span class="lang-title">{$area_title}</span>
        <i class="layui-icon layui-icon-down layui-font-12"></i>
    </button>
    <button class="layui-btn layui-bg-green" lay-event="add">
        <i class="fa fa-plus"></i>
        {:__('Add')}
    </button>
    <button
        class="layui-btn layui-bg-blue btn-disabled disabled {:$auth->check('cms.tags/edit')?'':'hide'}"
        lay-event="edit">
        <i class="fa fa-pencil"></i>
        {:__('Edit')}
    </button>
    <button class="layui-btn layui-bg-red btn-disabled disabled {:$auth->check('cms.tags/del')?'':'hide'}" lay-event="del">
        <i class="fa fa-trash"></i>
        {:__('Del')}
    </button>
</script>
<script>
    layui.use(["badou","changeLang"], function () {
        var bdTable = layui.bdTable;
        var table = layui.table;
        var layer = layui.layer;
        var dropdown = layui.dropdown;
        var changeLang=layui.changeLang;
        bdTable.api.init({
            table: table,
            extend: {
                index_url: "cms.tags/index",
                add_url: "cms.tags/add",
                edit_url: "cms.tags/edit",
                del_url: "cms.tags/del",
                multi_url: "cms.tags/multi",
                table: "cms_tags",
            },
        });
        bdTable.render({
            elem: "#tags",
            url: "{:url('cms.tags/index')}",
            pk: "id",
            even: true,
            toolbar: "#toolbar",
            page: true,
            cols: [
                [
                    { type: "checkbox" },
                    { field: "id", title: "ID", width: 80, sort: true },
                    { field: "name", title: __("Name"), },
                    { field: "link", title: __("Link"), },
                    { title: __("Operate"), align: "center", templet: bdTable.api.formatter.operate },
                ],
            ],
            done: function(res, curr, count){
                changeLang({
                    table:bdTable
                });
            }
        });
    });
</script>
