{layout name="layout/form" /}

<form class="layui-form" method="post">
    {:token_field()}

    <div class="layui-form-item">
        <label class="layui-form-label">表单名称</label>
        <div class="layui-input-block">
            <input
                type="text"
                name="row[form_name]"
                value="{$row.form_name}"
                lay-verify="required"
                placeholder="请输入表单名称"
                autocomplete="off"
                class="layui-input" />
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">表名称</label>
        <div class="layui-input-block">
            <input
                type="text"
                name="row[table_name]"
                value="{$row.table_name}"
                lay-verify="required"
                placeholder="请输入表名称"
                autocomplete="off"
                class="layui-input" />
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <input type="hidden" name="row[id]" value="{$row.id}" />
            <button class="layui-btn btn-theme-color disabled" lay-submit>立即提交</button>
            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
    </div>
</form>

<script>
    layui.use(["badou"], function () {
        var bdForm = layui.bdForm;
        bdForm.api.bindevent($("form.layui-form"));
    });
</script>
