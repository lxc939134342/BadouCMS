{layout name="layout/default" /}

<style>
  .geo-agent-demo {
    --agent-primary: #4E73DF;
    --agent-primary-hover: #3F62C8;
    --agent-primary-deep: #3554AA;
    --agent-primary-soft: #EEF2FF;
    --agent-primary-pale: #F6F8FF;
    --agent-primary-border: #DCE4FA;
    --agent-ink: #27334F;
    --agent-muted: #7D89A3;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: 238px minmax(0, 1fr);
    height: 100%;
    min-height: 0;
    overflow: hidden;
    border: 1px solid #E3E8F5;
    border-radius: 10px;
    background: #fff;
  }

  .geo-agent-demo__primary {
    border-color: var(--agent-primary) !important;
    background: var(--agent-primary) !important;
    color: #fff !important;
  }

  .geo-agent-demo__primary:hover,
  .geo-agent-demo__primary:focus {
    border-color: var(--agent-primary-hover) !important;
    background: var(--agent-primary-hover) !important;
    color: #fff !important;
  }

  .geo-agent-demo__side {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border-right: 1px solid #E3E8F5;
    background: #F7F8FC;
  }

  .geo-agent-demo__side-head {
    padding: 18px 14px 12px;
  }

  .geo-agent-demo__side-head .layui-btn {
    width: 100%;
  }

  .geo-agent-demo__side-title {
    padding: 10px 16px;
    color: var(--agent-muted);
    font-size: 12px;
  }

  .geo-agent-demo__sessions {
    flex: 1;
    overflow: auto;
    padding: 0 8px 16px;
  }

  .geo-agent-demo__account {
    margin: 8px 12px 14px;
    padding: 12px;
    border: 1px solid var(--agent-primary-border);
    border-radius: 10px;
    background: #fff;
  }

  .geo-agent-demo__account-name {
    overflow: hidden;
    color: var(--agent-ink);
    font-size: 13px;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .geo-agent-demo__account-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
    color: var(--agent-muted);
    font-size: 12px;
  }

  .geo-agent-demo__account-role {
    color: var(--agent-primary-deep);
  }

  .geo-agent-demo__account-track {
    height: 6px;
    margin-top: 10px;
    overflow: hidden;
    border-radius: 99px;
    background: #E9EDFA;
  }

  .geo-agent-demo__account-bar {
    height: 100%;
    border-radius: 99px;
    background: var(--agent-primary);
  }

  .geo-agent-demo__account-bar.is-low {
    background: #e07a3d;
  }

  .geo-agent-demo__account-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .geo-agent-demo__account-actions button,
  .geo-agent-demo__account-actions a {
    flex: 1;
    height: 28px;
    border: 1px solid var(--agent-primary-border);
    border-radius: 6px;
    background: var(--agent-primary-pale);
    color: var(--agent-primary-deep);
    font-size: 12px;
    line-height: 26px;
    text-align: center;
    cursor: pointer;
  }

  .geo-agent-demo__session-row {
    position: relative;
    display: flex;
    align-items: center;
    border-radius: 7px;
  }

  .geo-agent-demo__session-row:hover,
  .geo-agent-demo__session-row.is-active {
    background: var(--agent-primary-soft);
  }

  .geo-agent-demo__session-row:hover .geo-agent-demo__session,
  .geo-agent-demo__session-row.is-active .geo-agent-demo__session {
    color: var(--agent-primary-deep);
  }

  .geo-agent-demo__session {
    flex: 1;
    min-width: 0;
    padding: 10px 30px 10px 12px;
    overflow: hidden;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #39455F;
    cursor: pointer;
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .geo-agent-demo__session-del {
    position: absolute;
    right: 6px;
    top: 50%;
    display: none;
    width: 22px;
    height: 22px;
    transform: translateY(-50%);
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #98A4BD;
    font-size: 13px;
    line-height: 22px;
    cursor: pointer;
  }

  .geo-agent-demo__session-row:hover .geo-agent-demo__session-del {
    display: block;
  }

  .geo-agent-demo__session-del:hover {
    background: #fde8e8;
    color: #c0392b;
  }

  .geo-agent-demo__main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  .geo-agent-demo__messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 22px max(20px, calc((100% - 820px) / 2));
  }

  .geo-agent-demo__welcome {
    max-width: 660px;
    margin: 12vh auto 0;
    text-align: center;
  }

  .geo-agent-demo__welcome h2 {
    margin-bottom: 12px;
    color: var(--agent-ink);
    font-size: 22px;
  }

  .geo-agent-demo__welcome p {
    color: var(--agent-muted);
    line-height: 1.8;
  }

  .geo-agent-demo__examples {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 22px;
  }

  .geo-agent-demo__example {
    padding: 8px 12px;
    border: 1px solid var(--agent-primary-border);
    border-radius: 7px;
    background: #fff;
    color: var(--agent-primary-deep);
    cursor: pointer;
  }

  .geo-agent-demo__turn {
    display: flex;
    margin-bottom: 20px;
  }

  .geo-agent-demo__turn.is-user {
    justify-content: flex-end;
  }

  .geo-agent-demo__bubble {
    max-width: min(88%, 680px);
    padding: 12px 15px;
    border-radius: 12px;
    background: #F4F6FB;
    color: #36435E;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .geo-agent-demo__turn.is-assistant .geo-agent-demo__bubble {
    width: 100%;
    max-width: 100%;
  }

  .geo-agent-demo__turn.is-user .geo-agent-demo__bubble {
    background: #E8EDFF;
  }

  .geo-agent-demo__user-wrap { max-width: min(88%, 680px); min-width: 0; }
  .geo-agent-demo__user-wrap .geo-agent-demo__bubble { max-width: 100%; }
  .geo-agent-demo__message-actions { display: flex; justify-content: flex-end; gap: 3px; margin-top: 5px; }
  .geo-agent-demo__message-action {
    display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
    padding: 0; border: 0; border-radius: 6px; background: transparent;
    color: var(--agent-muted); font-size: 13px; cursor: pointer;
  }
  .geo-agent-demo__message-action:hover { background: var(--agent-primary-soft); color: var(--agent-primary-deep); }
  .geo-agent-demo__message-action:focus-visible { outline: 2px solid var(--agent-primary); outline-offset: 2px; }
  .geo-agent-demo__message-action:disabled { opacity: .4; cursor: default; }
  .geo-agent-demo__turn.is-editing .geo-agent-demo__bubble { box-shadow: 0 0 0 2px var(--agent-primary-border); }
  .geo-agent-demo__edit-banner {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding: 10px 12px;
    border-radius: 8px; background: var(--agent-primary-soft); color: var(--agent-primary-deep);
    font-size: 12px; line-height: 1.6;
  }
  .geo-agent-demo__edit-banner[hidden] { display: none; }
  .geo-agent-demo__edit-banner span { flex: 1; min-width: 0; }
  .geo-agent-demo__edit-banner button { border: 0; padding: 5px 8px; border-radius: 5px; background: #fff; color: inherit; cursor: pointer; white-space: nowrap; }
  @media (pointer: coarse) { .geo-agent-demo__message-action { width: 36px; height: 36px; } }

  .geo-agent-demo__activity {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 9px;
    color: var(--agent-muted);
    font-size: 12px;
    white-space: normal;
  }

  .geo-agent-demo__activity.is-running .geo-agent-demo__status::before {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 7px;
    border-radius: 50%;
    background: var(--agent-primary);
    content: '';
    animation: geo-agent-pulse 1.2s ease-in-out infinite;
  }

  .geo-agent-demo__activity.is-error {
    color: #d95858;
  }

  .geo-agent-demo__elapsed {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  .geo-agent-demo__tools {
    margin-bottom: 8px;
  }

  .geo-agent-demo__tools:empty {
    display: none;
  }

  .geo-agent-demo__tool {
    color: var(--agent-primary-deep);
    font-size: 12px;
    white-space: normal;
  }

  .geo-agent-demo__tool.is-running {
    color: var(--agent-muted);
  }

  .geo-agent-demo__tool.is-error {
    color: #d95858;
  }

  .geo-agent-demo__content {
    white-space: normal;
  }

  .geo-agent-demo__content p {
    margin: 0 0 8px;
  }

  .geo-agent-demo__content p:last-child,
  .geo-agent-demo__content ul:last-child,
  .geo-agent-demo__content ol:last-child,
  .geo-agent-demo__content pre:last-child,
  .geo-agent-demo__content .geo-agent-demo__table-wrap:last-child {
    margin-bottom: 0;
  }

  .geo-agent-demo__content h1,
  .geo-agent-demo__content h2,
  .geo-agent-demo__content h3,
  .geo-agent-demo__content h4 {
    margin: 12px 0 6px;
    font-weight: 600;
    line-height: 1.4;
  }

  .geo-agent-demo__content h1 {
    font-size: 18px;
  }

  .geo-agent-demo__content h2 {
    font-size: 16px;
  }

  .geo-agent-demo__content h3,
  .geo-agent-demo__content h4 {
    font-size: 15px;
  }

  .geo-agent-demo__content ul,
  .geo-agent-demo__content ol {
    margin: 0 0 8px;
    padding-left: 1.3em;
  }

  .geo-agent-demo__content a {
    color: var(--agent-primary-deep);
  }

  .geo-agent-demo__content a.btn-addtab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 2px 0;
    padding: 3px 11px;
    border: 1px solid #C9D5F5;
    border-radius: 999px;
    background: var(--agent-primary-soft);
    color: var(--agent-primary-deep);
    text-decoration: none;
  }

  .geo-agent-demo__content a.btn-addtab::before {
    font-family: 'FontAwesome';
    content: '\f0da';
    font-size: 11px;
  }

  .geo-agent-demo__content td a.btn-addtab,
  .geo-agent-demo__content th a.btn-addtab {
    display: inline;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    text-decoration: underline;
  }

  .geo-agent-demo__content td a.btn-addtab::before,
  .geo-agent-demo__content th a.btn-addtab::before {
    content: none;
  }

  .geo-agent-demo__content code {
    padding: 0 4px;
    border-radius: 4px;
    background: rgba(0, 0, 0, .06);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .geo-agent-demo__content pre {
    margin: 0 0 8px;
    padding: 10px 12px;
    overflow: auto;
    border-radius: 8px;
    background: #202B45;
    color: #E7EDFF;
  }

  .geo-agent-demo__content pre code {
    padding: 0;
    background: transparent;
    color: inherit;
  }

  .geo-agent-demo__table-wrap {
    max-width: 100%;
    margin: 8px 0;
    overflow-x: auto;
  }

  .geo-agent-demo__content table {
    width: 100%;
    border-collapse: collapse;
    white-space: normal;
  }

  .geo-agent-demo__content th,
  .geo-agent-demo__content td {
    padding: 6px 9px;
    border: 1px solid var(--agent-primary-border);
    text-align: left;
    vertical-align: top;
  }

  .geo-agent-demo__content th {
    background: #F0F3FF;
    font-weight: 600;
  }

  .geo-agent-demo__content tr:nth-child(even) td {
    background: #FAFBFF;
  }

  .geo-agent-demo__content img {
    max-width: 100%;
    max-height: 180px;
    border-radius: 6px;
    vertical-align: middle;
    cursor: zoom-in;
  }

  .geo-agent-demo__content th img,
  .geo-agent-demo__content td img {
    max-width: 64px;
    max-height: 64px;
  }

  .geo-agent-demo__content.is-streaming::after {
    color: var(--agent-primary);
    content: '▍';
    animation: geo-agent-pulse 1s ease-in-out infinite;
  }

  @keyframes geo-agent-pulse {
    50% {
      opacity: .3;
    }
  }

  .geo-agent-demo__composer {
    flex-shrink: 0;
    padding: 12px max(20px, calc((100% - 820px) / 2)) 16px;
    border-top: 1px solid #E8EBF4;
  }

  .geo-agent-demo__box {
    position: relative;
    border: 1px solid var(--agent-primary-border);
    border-radius: 14px;
    background: #fff;
    padding: 6px 8px 8px;
    transition: border-color .15s, box-shadow .15s;
  }

  .geo-agent-demo__box:focus-within {
    border-color: var(--agent-primary);
    box-shadow: 0 0 0 3px rgba(78, 115, 223, .12);
  }

  .geo-agent-demo__box textarea {
    width: 100%;
    height: 54px;
    min-height: 54px;
    padding: 8px 6px;
    border: 0;
    background: transparent;
    resize: none;
    box-shadow: none;
    font-size: 14px;
    line-height: 1.6;
    outline: none;
  }

  .geo-agent-demo__bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .geo-agent-demo__bar-left {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .geo-agent-demo__icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 8px;
    background: #F0F3FA;
    color: #4A5874;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }

  .geo-agent-demo__icon-btn:hover {
    background: #E8EDFF;
    color: var(--agent-primary-deep);
  }

  .geo-agent-demo__pop {
    display: none;
    position: absolute;
    left: 0;
    bottom: calc(100% + 8px);
    z-index: 30;
    box-sizing: border-box;
    width: 160px;
    padding: 4px;
    border: 1px solid var(--agent-primary-border);
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
  }

  .geo-agent-demo__pop.is-open {
    display: block;
  }

  .geo-agent-demo__pop button {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #39455F;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
  }

  .geo-agent-demo__pop button:hover {
    background: var(--agent-primary-soft);
    color: var(--agent-primary-deep);
  }

  .geo-agent-demo__mode {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 10px;
    border: 1px solid var(--agent-primary-border);
    border-radius: 8px;
    background: #fff;
    color: #39455F;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  .geo-agent-demo__mode:hover {
    border-color: #C9D5F5;
    color: var(--agent-primary-deep);
  }

  .geo-agent-demo__mode .fa-angle-down {
    color: #98A4BD;
    font-size: 11px;
  }

  .geo-agent-demo__send {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 10px;
    background: var(--agent-primary);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s;
  }

  .geo-agent-demo__send:hover {
    background: var(--agent-primary-hover);
  }

  .geo-agent-demo__send:disabled {
    background: #C8D1E8;
    cursor: default;
  }

  .geo-agent-demo__patches {
    margin-top: 12px;
  }

  .geo-agent-demo__patches-title {
    margin-bottom: 8px;
    color: var(--agent-muted);
    font-size: 12px;
  }

  .geo-agent-demo__patch {
    margin-bottom: 12px;
    overflow: hidden;
    border: 1px solid var(--agent-primary-border);
    border-radius: 10px;
    background: #fff;
  }

  .geo-agent-demo__patch-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid #E4E9F7;
    background: #F5F7FF;
  }

  .geo-agent-demo__patch-file {
    color: var(--agent-ink);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .geo-agent-demo__patch-status {
    margin-left: auto;
    padding: 1px 8px;
    border-radius: 999px;
    background: #EEF1F8;
    color: var(--agent-muted);
    font-size: 11px;
    white-space: nowrap;
  }

  .geo-agent-demo__patch-status.is-pending {
    background: #fff3d6;
    color: #9a6b00;
  }

  .geo-agent-demo__patch-status.is-applied {
    background: #E8EDFF;
    color: var(--agent-primary-deep);
  }

  .geo-agent-demo__patch-status.is-reverted {
    background: #fde8e8;
    color: #c0392b;
  }

  .geo-agent-demo__patch-reason {
    padding: 6px 12px 0;
    color: #9a6b00;
    font-size: 12px;
  }

  .geo-agent-demo__patch-diff {
    margin: 0;
    padding: 10px 12px;
    overflow-x: auto;
    background: #202B45;
    color: #E2E9FA;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre;
  }

  .geo-agent-demo__patch-diff .is-add {
    color: #8FB2FF;
  }

  .geo-agent-demo__patch-diff .is-del {
    color: #ff9a9a;
  }

  .geo-agent-demo__patch-diff .is-ctx {
    color: #A2AEC9;
  }

  .geo-agent-demo__patch-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 12px;
  }

  .geo-agent-demo__approval {
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--agent-primary-border);
    border-radius: 12px;
    background: #fff;
  }

  .geo-agent-demo__approval-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid #E9EDF6;
  }

  .geo-agent-demo__approval-icon {
    display: grid;
    flex: 0 0 34px;
    height: 34px;
    place-items: center;
    border-radius: 9px;
    background: var(--agent-primary-soft);
    color: var(--agent-primary);
    font-size: 15px;
  }

  .geo-agent-demo__approval-heading {
    flex: 1;
    min-width: 0;
    color: var(--agent-ink);
    font-size: 15px;
    font-weight: 600;
    overflow-wrap: anywhere;
  }

  .geo-agent-demo__approval-caption {
    margin-top: 3px;
    color: var(--agent-muted);
    font-size: 12px;
    font-weight: 400;
  }

  .geo-agent-demo__approval-badge {
    flex-shrink: 0;
    padding: 3px 9px;
    border-radius: 5px;
    background: var(--agent-primary-soft);
    color: var(--agent-primary-deep);
    font-size: 11px;
    line-height: 1.5;
  }

  .geo-agent-demo__approval-section {
    padding: 20px;
  }

  .geo-agent-demo__approval-section + .geo-agent-demo__approval-section {
    border-top: 1px solid #E9EDF6;
  }

  .geo-agent-demo__approval-label {
    margin-bottom: 8px;
    color: var(--agent-muted);
    font-size: 12px;
  }

  .geo-agent-demo__approval-title {
    color: var(--agent-ink);
    font-family: "Songti SC", "STSong", serif;
    font-size: 21px;
    font-weight: 600;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .geo-agent-demo__approval-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin: 10px 0 16px;
    color: var(--agent-muted);
    font-size: 12px;
  }

  .geo-agent-demo__approval-body {
    max-height: 280px;
    padding: 16px 18px;
    overflow-y: auto;
    border: 1px solid #E9EDF6;
    border-radius: 8px;
    background: #FAFBFE;
    color: #46516A;
    font-size: 14px;
    line-height: 1.9;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    scrollbar-width: thin;
  }

  .geo-agent-demo__approval-fields {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    gap: 8px 14px;
    margin: 16px 0 0;
    font-size: 12px;
    line-height: 1.7;
  }

  .geo-agent-demo__approval-fields dt {
    color: var(--agent-muted);
    font-weight: 400;
  }

  .geo-agent-demo__approval-fields dd {
    max-height: 120px;
    margin: 0;
    overflow-y: auto;
    color: #46516A;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    scrollbar-width: thin;
  }

  .geo-agent-demo__approval-route {
    display: flex;
    flex-wrap: wrap;
    align-items: center;

<script>
  layui.use(['badou', 'jquery', 'bdUpload', 'layer', 'laytpl'], function () {
    var $ = layui.jquery;
    var badou = layui.badou;
    var laytpl = layui.laytpl;
    var layer = layui.layer;
    var canUpload = "{if $canEditUsers}true{else } false{/if}";
    var syncKey = 'badou.agent.currentChat.' + Number('{$adminId}');
    var $approveMode = $('#geo-agent-demo-approve-mode');
    var approveModeKey = 'badou.agent.approveMode.' + Number('{$adminId}');
    var patchUrls = {
      approve: '{:url("agent/approve")}',
      reject: '{:url("agent/reject")}',
      rollback: '{:url("agent/rollback")}'
    };
    var chatId = 0;
    var sending = false;
    var activeRequest = null;
    var pendingApproval = null;
    var chatRevision = '';
    var editingMessage = null;
    var languageTaskTimer = null;
    var wakingLanguageTask = false;
    var canSend = Number('{:$canSend ? 1 : 0}') === 1;
    var startedNewChat = false;
    var $messages = $('#geo-agent-demo-messages');
    var $input = $('#geo-agent-demo-input');
    var $account = $('#geo-agent-demo-account');
    var $agentView = $('.geo-agent-demo');
    var modelReady = '{if $modelReady}true{else}false{/if}' === 'true';
    var drawerMode = $agentView.hasClass('geo-agent-demo--drawer');
    var drawerSessionsKey = 'badou.agent.drawer.sessions.' + Number('{$adminId}');
    var draftKey = 'badou.agent.draft.' + Number('{$adminId}');

    try {
      var savedDraft = sessionStorage.getItem(draftKey);
      if (savedDraft) $input.val(savedDraft);
    } catch (ignored) { }

    // 恢复自动批准设置
    try {
      var savedMode = localStorage.getItem(approveModeKey);
      if (savedMode === 'auto' || savedMode === 'manual') {
        $approveMode.data('mode', savedMode).attr('data-mode', savedMode);
        $('#geo-agent-demo-approve-label').text(savedMode === 'auto' ? '自动批准' : '请求批准');
      }
    } catch (ignored) { }

    function updateAgentToken(token) {
      if (!token) return;
      [window, parent, top].forEach(function (frame) {
        try { if (frame.Config) frame.Config.token = token; } catch (ignored) { }
      });
      $("input[name='__token__']").val(token);
    }

    function currentAgentToken() {
      try { if (top.Config && top.Config.token) return top.Config.token; } catch (ignored) { }
      return typeof Config !== 'undefined' ? Config.token : '';
    }

    function isAgentTokenError(ret) {
      return ret && Number(ret.code) === 0 && /令牌错误|Token verification error/i.test(ret.msg || '')
        && ret.data && typeof (ret.data.__token__ || ret.data.token) === 'string'
        && (ret.data.__token__ || ret.data.token) !== '';
    }

    function agentRequestError(ret, action) {
      var message = (ret && ret.msg) || '请求失败，请稍后重试';
      var needLogin = ret && (/index\/login(?:[./?#]|$)/i.test(ret.url || '')
        || /请先登录后台账号|Please login first/i.test(message));
      if (needLogin) message = action === 'delete' ? '后台登录已过期，请重新登录后删除会话。' : '后台登录已过期，请重新登录后继续，输入内容已保留。';
      else if (/令牌错误|Token verification error/i.test(message)) message = action === 'delete' ? '页面状态同步未完成，请重新尝试删除会话。' : '页面状态同步未完成，请再次发送，输入内容已保留。';
      var error = new Error(message);
      error.needLogin = !!needLogin;
      return error;
    }

    async function requestAgentStream(form) {
      // 只有校验拦截返回了新令牌时才重发；流已开始、网络错误或业务错误均不重发。
      for (var attempt = 0; attempt < 2; attempt++) {
        var token = currentAgentToken();
        updateAgentToken(token);
        if (token) form.set('__token__', token);
        var response = await fetch('{:url("agent/send")}', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Accept': 'text/event-stream', 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8', 'X-Requested-With': 'XMLHttpRequest' },
          body: form.toString()
        });
        updateAgentToken(response.headers.get('__token__'));
        if (response.ok && (response.headers.get('content-type') || '').includes('text/event-stream')) return response;
        var raw = await response.text();
        var ret = null;
        try { ret = JSON.parse(raw); } catch (ignored) { }
        if (isAgentTokenError(ret)) {
          updateAgentToken(ret.data.__token__ || ret.data.token);
          if (attempt === 0) continue;
        }
        if (response.redirected && /index\/login(?:[./?#]|$)/i.test(response.url || '')) ret = { url: response.url };
        throw agentRequestError(ret);
      }
    }

    async function requestAgentStop(requestId) {
      for (var attempt = 0; attempt < 2; attempt++) {
        var ret = await new Promise(function (resolve) {
          badou.api.ajax({ url: 'agent/send', type: 'POST', loading: false,
            data: { action: 'stop', request_id: requestId, __token__: currentAgentToken() }
          }, function (data, response) { resolve(response || { code: 1, data: data }); return false; },
          function (data, response) { resolve(response || { code: 0, data: data }); return false; });
        });
        if (isAgentTokenError(ret)) {
          updateAgentToken(ret.data.__token__ || ret.data.token);
          if (attempt === 0) continue;
        }
        if (ret.data && ret.data.__token__) updateAgentToken(ret.data.__token__);
        if (Number(ret.code) === 1) return;
        throw agentRequestError(ret);
      }
    }

    function stop() {
      var request = activeRequest;
      if (!request || request.stopping) return;
      request.stopping = true;
      var $send = $('#geo-agent-demo-send').prop('disabled', true).attr('title', '正在停止').attr('aria-label', '正在停止')
        .html('<i class="fa fa-spinner fa-spin"></i>');

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    function menuLinkTitle(href) {
      href = href.replace(/&amp;/g, '&');
      try {
        return top.$('#sideMenu').find('a[menu-url]').filter(function () {
          return top.$(this).attr('menu-url') === href;
        }).first().attr('menu-title') || '';
      } catch (ignored) { return ''; }
    }

    function inlineMarkdown(text) {
      return text
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (match, alt, src) {
          // 只允许 http(s) 和站内相对路径，避免 javascript: 等伪协议。
          return /^(?:https?:\/\/|\/)/i.test(src)
            ? '<img src="' + src + '" alt="' + alt + '" class="geo-agent-demo__inline-image" loading="lazy">'
            : match;
        })
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (match, text, href) {
          if (/^https?:\/\//i.test(href)) {
            return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + text + '</a>';
          }
          // 后台菜单路由：交给 .btn-addtab 打开/复用后台标签页。
          if (/^[a-zA-Z0-9_.\-\/?=&#%;]+$/.test(href)) {
            // 菜单标题以侧边栏为准，避免模型返回路由名后覆盖标签页名称。
            var title = menuLinkTitle(href);
            if (title) text = escapeHtml(title);
            return '<a href="' + href + '" class="btn-addtab" title="' + text + '">' + text + '</a>';
          }
          return match;
        });
    }

    function splitTableRow(line) {
      var row = line.trim();
      if (row.charAt(0) === '|') row = row.slice(1);
      if (row.charAt(row.length - 1) === '|' && row.charAt(row.length - 2) !== '\\') row = row.slice(0, -1);
      var cells = [];
      var cell = '';
      var inCode = false;
      for (var i = 0; i < row.length; i++) {
        if (row.charAt(i) === '\\' && row.charAt(i + 1) === '|') { cell += '|'; i++; continue; }
        if (row.charAt(i) === '`') inCode = !inCode;
        if (row.charAt(i) === '|' && !inCode) { cells.push(cell.trim()); cell = ''; continue; }
        cell += row.charAt(i);
      }
      cells.push(cell.trim());
      return cells;
    }

    function tableAlignments(line, count) {
      var cells = splitTableRow(line);
      if (cells.length !== count || !cells.every(function (cell) { return /^:?-{3,}:?$/.test(cell); })) return null;
      return cells.map(function (cell) {
        return cell.charAt(0) === ':' ? (cell.charAt(cell.length - 1) === ':' ? 'center' : 'left') : (cell.charAt(cell.length - 1) === ':' ? 'right' : 'left');
      });
    }

    function renderMarkdown(source) {
      var blocks = [];
      var text = escapeHtml(source || '').replace(/\r\n/g, '\n');
      text = text.replace(/```[^\n]*\n([\s\S]*?)```/g, function (_, code) {
        blocks.push('<pre><code>' + code.replace(/\n$/, '') + '</code></pre>');
        return '\n%%BLOCK' + (blocks.length - 1) + '%%\n';
      });
      var html = [];
      var listType = '';
      function closeList() {
        if (!listType) return;
        html.push(listType === 'ol' ? '</ol>' : '</ul>');
        listType = '';
      }
      var lines = text.split('\n');
      for (var index = 0; index < lines.length; index++) {
        var line = lines[index];
        var block = line.match(/^%%BLOCK(\d+)%%$/);
        if (block) { closeList(); html.push(blocks[Number(block[1])]); continue; }
        if (line.indexOf('|') !== -1 && index + 1 < lines.length) {
          var headers = splitTableRow(line);
          var aligns = tableAlignments(lines[index + 1], headers.length);
          if (headers.length > 1 && aligns) {
            closeList();
            html.push('<div class="geo-agent-demo__table-wrap"><table><thead><tr>');
            headers.forEach(function (cell, column) {
              html.push('<th style="text-align:' + aligns[column] + '">' + inlineMarkdown(cell) + '</th>');
            });
            html.push('</tr></thead><tbody>');
            index++;
            while (index + 1 < lines.length && lines[index + 1].trim() && lines[index + 1].indexOf('|') !== -1) {
              var cells = splitTableRow(lines[++index]);
              html.push('<tr>');
              headers.forEach(function (_, column) {
                html.push('<td style="text-align:' + aligns[column] + '">' + inlineMarkdown(cells[column] || '') + '</td>');
              });
              html.push('</tr>');
            }
            html.push('</tbody></table></div>');
            continue;
          }
        }
        var heading = line.match(/^(#{1,4})\s+(.*)$/);
        if (heading) { closeList(); html.push('<h' + heading[1].length + '>' + inlineMarkdown(heading[2]) + '</h' + heading[1].length + '>'); continue; }
        var quote = line.match(/^&gt;\s?(.*)$/);
        if (quote) { closeList(); html.push('<blockquote>' + inlineMarkdown(quote[1]) + '</blockquote>'); continue; }
        var unordered = line.match(/^\s*[-*]\s+(.*)$/);
        if (unordered) {
          if (listType !== 'ul') { closeList(); html.push('<ul>'); listType = 'ul'; }
          html.push('<li>' + inlineMarkdown(unordered[1]) + '</li>');
          continue;
        }
        var ordered = line.match(/^\s*\d+\.\s+(.*)$/);
        if (ordered) {
          if (listType !== 'ol') { closeList(); html.push('<ol>'); listType = 'ol'; }
          html.push('<li>' + inlineMarkdown(ordered[1]) + '</li>');
          continue;
        }
        if (!line.trim()) { closeList(); continue; }
        closeList();
        html.push('<p>' + inlineMarkdown(line) + '</p>');
      }
      closeList();
      return html.join('');
    }

    async function copyMessage(text, $button) {
      try {
        if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('clipboard');
        await navigator.clipboard.writeText(text);
      } catch (error) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(textarea);
        textarea.select();
        var copied = false;
        try { copied = document.execCommand('copy'); } catch (ignored) { }
        textarea.remove();
        $input.focus();
        if (!copied) { layui.layer.msg('复制失败，请选中消息后手动复制'); return; }
      }
      $button.html('<i class="fa fa-check" aria-hidden="true"></i>').attr('title', '已复制');
      setTimeout(function () { $button.html('<i class="fa fa-copy" aria-hidden="true"></i>').attr('title', '复制消息'); }, 1800);
    }

      $messages.find('.is-editing').removeClass('is-editing');

    function cancelMessageEdit(restoreDraft) {
      if (restoreDraft && editingMessage) $input.val(editingMessage.draft);

    function renderChatMessages(data) {

      });
      if (data.approval) renderApproval(approvalParts || addMessage({ role: 'assistant', content: '', duration_ms: 0 }), data.approval);

    function syncEditableMessages(data, userTurn) {
      chatRevision = data.revision || '';
      var stored = data.messages || [];
      var ids = stored.filter(function (item) { return item.role === 'user'; }).map(function (item) { return item.message_id; });
      stored.forEach(function (item, index) {
        if (userTurn && item.role === 'assistant' && item.run_id === data.run_id && index > 0 && stored[index - 1].role === 'user') {
          userTurn.data('messageId', stored[index - 1].message_id);
        }

    function formatDuration(milliseconds) {
      var totalSeconds = Math.floor(Math.max(0, milliseconds) / 1000);
      var minutes = Math.floor(totalSeconds / 60);
      var seconds = totalSeconds % 60;
      return '用时 ' + (minutes ? minutes + ' 分钟 ' : '') + seconds + ' 秒';

    function loadSessions(resumeLatest) {
      badou.api.ajax({ url: 'agent/sessions', type: 'GET', loading: false }, function (data) {
        var $list = $('#geo-agent-demo-sessions').empty();
        var sessions = data.list || [];
        sessions.forEach(function (session) {
          var id = Number(session.id);
          var $row = $('<div class="geo-agent-demo__session-row"></div>').toggleClass('is-active', id === chatId);
          var title = session.title || '未命名会话';

            .text(title)

            .on('click', function (event) { event.stopPropagation(); deleteSession(id); });
          $row.append($button, $del);
          $list.append($row);

        if (resumeLatest && !chatId && !startedNewChat && sessions.length) {
          var preferredId = storedChatId();
          var preferredSession = sessions.find(function (session) { return Number(session.id) === preferredId; });

    async function requestAgentDelete(id) {
      // 令牌校验在删除逻辑之前执行，仅校验失败可补发，避免网络异常时重复删除。
      for (var attempt = 0; attempt < 2; attempt++) {
        updateAgentToken(currentAgentToken());
        var ret = await new Promise(function (resolve) {
          badou.api.ajax({ url: '{:url("agent/delete")}', type: 'POST', loading: false,
            data: { id: id, __token__: currentAgentToken() }
          }, function (data, response) { resolve(response || { code: 1, data: data }); return false; },
          function (data, response) { resolve(response || { code: 0, data: data }); return false; });
        });
        if (isAgentTokenError(ret)) {
          updateAgentToken(ret.data.__token__ || ret.data.token);
          if (attempt === 0) continue;
        }
        if (Number(ret.code) === 1) return;
        throw agentRequestError(ret, 'delete');
      }
    }

    function deleteSession(id) {
      layui.layer.confirm('删除后该会话的聊天记录和代码改动记录都会被删除，且不可恢复（已写入文件的代码不会自动还原）。确定删除？', { title: '删除会话', icon: 3 }, function (index) {
        layui.layer.close(index);
        requestAgentDelete(id).then(function () {
          badou.api.success({ message: '已删除' });
          if (Number(id) === chatId) { chatId = 0; syncChatState('new'); showWelcome(); }
          loadSessions();
        }).catch(function (error) { badou.api.error({ message: error.message || '删除失败' }); });
      });

    function statusText(status) {

    }

    function loadPatches() {
      if (!chatId) { renderPatches([]); return; }
      badou.api.ajax({ url: 'agent/patches', type: 'GET', data: { id: chatId }, loading: false }, function (data) {

    function renderPatches(list) {
      // 只清理代码改动卡片，保留当前待处理的工具审批。
      $messages.find('.geo-agent-demo__code-patch, .geo-agent-demo__patches').remove();
      if (!list || !list.length) return;
      var queue = list.slice();
      // 把改动卡片锚定到“调用过 提出代码改动 的那一轮回答”下面，而不是堆在列表末尾。
      $messages.find('.geo-agent-demo__turn.is-assistant').each(function () {
        if (!queue.length) return;
        var tools = $(this).data('tools') || [];
        if (tools.indexOf('提出代码改动') === -1) return;
        $(this).after(patchCard(queue.shift()));
      });
      // 没有对应回答的（比如历史被裁剪）放到底部兜底区
      if (queue.length) {
        var $section = $('<div class="geo-agent-demo__patches" id="geo-agent-demo-patches"></div>');
        $section.append($('<div class="geo-agent-demo__patches-title"></div>').text('其他代码改动'));
        queue.forEach(function (patch) { $section.append(patchCard(patch)); });
        $messages.append($section);

      $messages.scrollTop($messages[0].scrollHeight);

    function patchCard(patch) {
      var $card = $('<div class="geo-agent-demo__patch geo-agent-demo__code-patch"></div>');
      var $head = $('<div class="geo-agent-demo__patch-head"></div>');
      $head.append($('<span class="geo-agent-demo__patch-file"></span>').text('#' + patch.id + ' ' + (patch.file || '')));
      $head.append($('<span class="geo-agent-demo__patch-status"></span>').addClass('is-' + patch.status).text(statusText(patch.status)));
      $card.append($head);
      if (patch.review_reason) {
        $card.append($('<div class="geo-agent-demo__patch-reason"></div>').text('自审：' + patch.review_reason));
      }
      var $diff = $('<pre class="geo-agent-demo__patch-diff"></pre>');
      String(patch.diff || '').split('\n').forEach(function (line) {
        var cls = line.charAt(0) === '+' ? 'is-add' : (line.charAt(0) === '-' ? 'is-del' : 'is-ctx');
        $diff.append($('<div></div>').addClass(cls).text(line));
      });
      $card.append($diff);
      var $actions = $('<div class="geo-agent-demo__patch-actions"></div>');
      if (patch.status === 'pending') {
        $actions.append($('<button type="button" class="layui-btn layui-btn-sm geo-agent-demo__primary"></button>').text('批准').on('click', function () { patchAction('approve', patch.id); }));
        $actions.append($('<button type="button" class="layui-btn layui-btn-sm layui-btn-primary"></button>').text('拒绝').on('click', function () { patchAction('reject', patch.id); }));
      } else if (patch.status === 'applied') {
        $actions.append($('<button type="button" class="layui-btn layui-btn-sm layui-btn-danger"></button>').text('回退').on('click', function () { patchAction('rollback', patch.id); }));
      }
      if ($actions.children().length) $card.append($actions);
      return $card;
    }

    function patchAction(action, id) {
      if (!patchUrls[action]) return;
      var form = new URLSearchParams();
      form.set('patch_id', String(id));
      if (typeof Config !== 'undefined' && Config.token) form.set('__token__', Config.token);
      fetch(patchUrls[action], {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8', 'X-Requested-With': 'XMLHttpRequest' },
        body: form.toString()
      }).then(function (response) { return response.json(); }).then(function (res) {
        if (!res || Number(res.code) !== 1) throw new Error((res && res.msg) || '操作失败');
        layui.layer.msg(res.msg || '操作成功');
        loadPatches();
      }).catch(function (error) {
        layui.layer.msg(error.message || '操作失败');
        // 记录可能已被删除/状态已变，刷新列表避免残留卡片。
        loadPatches();
      });
    }

    function loadLanguageTasks() {
      clearTimeout(languageTaskTimer);
      var id = Number(chatId);
      if (!id) { renderLanguageTasks([]); return; }
      badou.api.ajax({ url: 'agent/taskStatus', type: 'GET', data: { id: id }, loading: false }, function (data) {
        if (Number(chatId) !== id) return false;
        var tasks = data.tasks || [];
        renderLanguageTasks(tasks);
        if (data.fpm_worker) wakeLanguageTasks(tasks);
        if (tasks.some(function (task) { return ['queued', 'running', 'interrupted'].indexOf(task.status) !== -1; })) languageTaskTimer = setTimeout(loadLanguageTasks, 3000);
        return false;
      }, function () {
        if (Number(chatId) === id) languageTaskTimer = setTimeout(loadLanguageTasks, 10000);
        return false;
      });
    }

    function wakeLanguageTasks(tasks) {
      if (!canSend || wakingLanguageTask) return;
      var task = tasks.find(function (item) { return ['queued', 'interrupted'].indexOf(item.status) !== -1; });
      if (!task) return;
      wakingLanguageTask = true;
      badou.api.ajax({ url: 'agent/send', type: 'POST', data: { action: 'task_wake', task_id: task.id, __token__: currentAgentToken() }, loading: false }, function () {
        wakingLanguageTask = false;
        return false;
      }, function () { wakingLanguageTask = false; return false; });
    }

    function approvalContentText(content) {
      // 正文以纯文本预览，不执行模型返回的 HTML，也不加载其中的图片或链接。
      return String(content || '')
        .replace(/<(script|style)\b[^>]*>[\s\S]*?<\/\1>/gi, '')
        .replace(/<\/(?:p|div|h[1-6]|li|blockquote|tr)\s*>|<br\s*\/?\s*>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .replace(/&(#\d+|#x[0-9a-f]+|amp|lt|gt|quot|apos|nbsp);/gi, function (match, entity) {
          var names = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ' };
          if (entity.charAt(0) !== '#') return names[entity.toLowerCase()] || match;
          var code = entity.charAt(1).toLowerCase() === 'x' ? parseInt(entity.slice(2), 16) : parseInt(entity.slice(1), 10);
          return code > 0 && code <= 0x10ffff && !(code >= 0xd800 && code <= 0xdfff) ? String.fromCodePoint(code) : match;
        })
        .replace(/\n[ \t]*\n(?:[ \t]*\n)+/g, '\n\n').trim();
    }

      $card.append($head);
      var fieldLabels = { language: '语言', scode: '栏目编号', aucode: '通用编码', filename: 'URL 名称', title: '标题', content: '正文', description: '摘要', keywords: '关键词',
        author: '作者', source: '来源', ico: '封面地址', name: '名称', id: '记录编号', user_id: '会员编号', email: '邮箱',
        mobile: '手机', status: '状态', source_scode: '源栏目', target: '目标语言', form_name: '表单名称', table_name: '表名' };
      actions.forEach(function (action) {
        var input = action.inputs || {};
        var isArticle = action.name === 'cms_article_create';
        var languageDisplay = action.display && ['cms_language_copy', 'cms_language_translate', 'cms_language_task_start'].indexOf(action.name) !== -1;
        var categoryDisplay = action.display && action.name === 'cms_category_update';
        var $section = $('<div class="geo-agent-demo__approval-section"></div>');
        if (actions.length > 1) $section.append($('<div class="geo-agent-demo__approval-heading"></div>').text(action.label || action.name));
        if (action.reason) $section.append($('<p class="geo-agent-demo__approval-reason"></p>').text(action.reason));
        if (languageDisplay) $section.append(renderLanguageApproval(action.display));
        if (isArticle) {
          $section.append($('<div class="geo-agent-demo__approval-label"></div>').text('文章标题'),
            $('<div class="geo-agent-demo__approval-title"></div>').text(input.title || '未填写标题'));
          var $meta = $('<div class="geo-agent-demo__approval-meta"></div>');
          var language = { cn: '中文', 'zh-cn': '简体中文', en: '英文' }[input.language] || input.language;
          if (language) $meta.append($('<span></span>').text(language));
          if (input.scode !== undefined) $meta.append($('<span></span>').text('栏目 #' + input.scode));
          $meta.append($('<span></span>').text('保存为草稿'));
          $section.append($meta, $('<div class="geo-agent-demo__approval-body" tabindex="0" aria-label="文章正文预览"></div>')
            .text(approvalContentText(input.content) || '未填写正文'));
        }
        var $fields = $('<dl class="geo-agent-demo__approval-fields"></dl>');
        if (categoryDisplay) {
          if (action.display.error) $section.append($('<p class="geo-agent-demo__approval-reason"></p>').text(action.display.error));
          (action.display.changes || []).forEach(function (change) {
            var before = change.before === '' ? '（空）' : String(change.before);
            var after = change.after === '' ? '（清空）' : String(change.after);
            $fields.append($('<dt></dt>').text(change.label), $('<dd></dd>').text(before + ' → ' + after));
          });
        }
        Object.keys(input).forEach(function (key) {
          if (languageDisplay || categoryDisplay || key === 'snapshot') return;
          if (isArticle && ['title', 'content', 'language', 'scode'].indexOf(key) !== -1) return;
          var value = input[key];
          if (value === '' || value === null || value === undefined) return;
          if (typeof value === 'boolean') value = value ? '是' : '否';
          else if (typeof value === 'object') value = JSON.stringify(value, null, 2);
          $fields.append($('<dt></dt>').text(fieldLabels[key] || key), $('<dd></dd>').text(String(value)));
        });
        if ($fields.children().length) $section.append($fields);
        var $details = $('<details class="geo-agent-demo__approval-details"></details>');
        $details.append($('<summary></summary>').text('查看完整参数'),
          $('<pre class="geo-agent-demo__approval-raw"></pre>').text(JSON.stringify(input, null, 2)));
        $section.append($details);
        $card.append($section);
      });
      var $actions = $('<div class="geo-agent-demo__patch-actions geo-agent-demo__approval-actions"></div>');
      if (canSend) {
        ['reject', refreshable ? 'refresh' : 'approve'].forEach(function (decision) {
          var label = decision === 'reject' ? '取消操作' : (decision === 'refresh' ? '重新读取并生成译文' : (categoryUpdate ? '确认保存栏目' : (backgroundTask ? '确认并开始后台任务' : (article ? '批准并保存草稿' : (copying ? '确认复制' : (translating ? '确认保存译文' : '批准' + (actions.length > 1 ? '全部' : '') + '操作'))))));
          $actions.append($('<button type="button" class="layui-btn layui-btn-sm"></button>')
            .prop('disabled', decision === 'approve' && unavailable)
            .toggleClass('layui-btn-primary', decision === 'reject').toggleClass('geo-agent-demo__primary', decision !== 'reject').text(label)
            .on('click', function () { send({ decision: decision, run_id: approval.run_id, attempt: approval.attempt }); }));
        });
      }
      if ($actions.children().length) $card.append($actions);
      parts.content.empty().append($card);
    }

    function send(approvalDecision) {
      // 点击事件对象不属于审批数据。
      if (!approvalDecision || !approvalDecision.decision) approvalDecision = null;
      var question = $.trim($input.val());
      if (sending || (!approvalDecision && !question)) return;
      var edit = approvalDecision ? null : editingMessage;
      if (pendingApproval && !approvalDecision && !edit) { layui.layer.msg('请先批准或取消当前操作'); return; }
      sending = true;
      var requestId = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function (byte) { return byte.toString(16).padStart(2, '0'); }).join('');
      var request = activeRequest = { id: requestId, stopping: false };
      var $send = $('#geo-agent-demo-send').prop('disabled', false).attr('title', '停止生成').attr('aria-label', '停止生成')
        .html('<i class="fa fa-stop"></i>');
      var userTurn = null;
      if (!approvalDecision) {
        $input.val('');
        userTurn = addMessage({ role: 'user', content: question }).turn;
      }
      $messages.find('.geo-agent-demo__patch-actions button').prop('disabled', true);
      $messages.find('.geo-agent-demo__message-edit').prop('disabled', true);
      $('#geo-agent-demo-edit-cancel').prop('disabled', true);
      var pending = addMessage({ role: 'assistant', content: '', pending: true });
      request.pending = pending;
      var startedAt = Date.now();
      var timer = setInterval(function () {
        pending.elapsed.text(formatDuration(Date.now() - startedAt));
      }, 1000);

      function finish() {
        clearInterval(timer);
        sending = false;
        activeRequest = null;
        $messages.find('.geo-agent-demo__message-edit').each(function () {
          $(this).prop('disabled', !$(this).closest('.geo-agent-demo__turn').data('messageId'));
        });
        $('#geo-agent-demo-edit-cancel').prop('disabled', false);
        $send.prop('disabled', !modelReady).attr('title', '发送').attr('aria-label', '发送').html('<i class="fa fa-arrow-up"></i>');
        if (editingMessage) $send.attr('title', '编辑并重新发送').attr('aria-label', '编辑并重新发送');
        $messages.scrollTop($messages[0].scrollHeight);
      }

      function handleEvent(block) {
        var eventName = 'message';
        var dataLines = [];
        block.split('\n').forEach(function (line) {
          if (line.indexOf('event:') === 0) eventName = line.slice(6).trim();
          if (line.indexOf('data:') === 0) dataLines.push(line.slice(5).trim());
        });
        if (!dataLines.length) return false;
        var data = JSON.parse(dataLines.join('\n'));
        if (eventName === 'session') {
          chatId = Number(data.id);
          chatRevision = data.revision || '';
          if (edit && data.messages) {
            cancelMessageEdit(false);
            renderChatMessages(data);
            userTurn = addMessage({ role: 'user', content: question }).turn;
            pending = addMessage({ role: 'assistant', content: '', pending: true });
            request.pending = pending;
          }
          syncChatState('refresh');
        } else if (eventName === 'progress') {
          pending.status.text(request.stopping ? '正在停止' : (data.message || '正在处理'));
        } else if (eventName === 'delta') {
          pending.status.text(request.stopping ? '正在停止' : '正在生成回答');
          pending.content.addClass('is-streaming').append(document.createTextNode(data.text || ''));
        } else if (eventName === 'tool_start') {
          pending.status.text(request.stopping ? '正在停止' : '正在调用工具');
          pending.content.removeClass('is-streaming').empty();
          pending.tools.append($('<div class="geo-agent-demo__tool is-running"></div>').data('toolName', data.name).text('○ 正在调用：' + data.name));
        } else if (eventName === 'tool_done') {
          var $running = pending.tools.children('.is-running').filter(function () { return $(this).data('toolName') === data.name; }).last();
          if ($running.length) $running.removeClass('is-running').text('✓ 已调用工具：' + data.name);
          else pending.tools.append($('<div class="geo-agent-demo__tool"></div>').text('✓ 已调用工具：' + data.name));
        } else if (eventName === 'tool_error') {
          var reason = data.message ? '：' + data.message : '';
          var $failed = pending.tools.children('.is-running').filter(function () { return $(this).data('toolName') === data.name; }).last();
          if ($failed.length) $failed.removeClass('is-running').addClass('is-error').text('× 调用失败：' + data.name + reason);
          else pending.tools.append($('<div class="geo-agent-demo__tool is-error"></div>').text('× 调用失败：' + data.name + reason));
        } else if (eventName === 'done' || eventName === 'approval' || eventName === 'stopped') {
          chatId = Number(data.id);
          syncChatState('refresh');
          pending.activity.removeClass('is-running');
          pendingApproval = null;
          pending.status.text(eventName === 'stopped' ? '已停止' : (eventName === 'approval' ? '等待确认' : '回复结束'));
          if (eventName === 'stopped') pending.tools.children('.is-running').removeClass('is-running').text('已停止，未继续调用');
          pending.elapsed.text(formatDuration(data.duration_ms || Date.now() - startedAt));
          // 记住本轮工具，供代码改动卡片锚定；保留已渲染的工具项，不再重绘。
          pending.turn.data('tools', data.tools || []);
          pending.turn.attr('data-run-id', data.run_id || '');
          pending.content.removeClass('is-streaming').html(renderMarkdown(data.answer || ''));
          if (data.approval) renderApproval(pending, data.approval);
          if (data.messages) syncEditableMessages(data, userTurn);
          return true;
        } else if (eventName === 'error') {
          throw new Error(data.message || '对话失败，请稍后重试');
        }
        $messages.scrollTop($messages[0].scrollHeight);
        return false;
      }

      async function requestStream() {
        await syncAgentAccount();
        // 普通 Ajax 只在请求结束后回调，这里按 SSE 事件更新对话内的进度。
        var form = new URLSearchParams();
        form.set('id', String(chatId));
        form.set('request_id', requestId);
        if (approvalDecision) {
          form.set('decision', approvalDecision.decision);
          form.set('run_id', approvalDecision.run_id);
          form.set('attempt', String(approvalDecision.attempt));
        } else {
          form.set('message', question);
          if (edit) {
            form.set('id', String(edit.chatId));
            form.set('edit_message_id', edit.id);
            form.set('edit_revision', edit.revision);
          }
        }
        form.set('auto_approve', $approveMode.length && $approveMode.data('mode') === 'auto' ? '1' : '0');
        var response = await requestAgentStream(form);
        if (!response.body) throw new Error('当前浏览器不支持读取实时进度');
        var reader = response.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';
        var completed = false;
        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          var boundary;
          while ((boundary = buffer.indexOf('\n\n')) !== -1) {
            var block = buffer.slice(0, boundary).replace(/\r/g, '');
            buffer = buffer.slice(boundary + 2);
            if (handleEvent(block)) completed = true;
          }
        }
        if (!completed) throw new Error('连接已中断，回答尚未完成');
      }

      requestStream().then(function () {
        try { sessionStorage.removeItem(draftKey); } catch (ignored) { }
        finish();
        loadSessions();
        loadPatches();
        renderAccount();
        loadLanguageTasks();
      }).catch(function (error) {
        pending.activity.removeClass('is-running').addClass('is-error');
        pending.status.text(error.needLogin ? '需要重新登录' : '请求失败');
        pending.content.removeClass('is-streaming').text(error.message || '对话失败，请稍后重试');
        if (error.needLogin) {
          try { sessionStorage.setItem(draftKey, question); } catch (ignored) { }
          pending.content.append($('<button type="button" class="layui-btn layui-btn-sm layui-btn-primary"></button>')
            .text('重新登录').on('click', function () {
              try { sessionStorage.setItem(draftKey, $input.val() || question); } catch (ignored) { }
              top.location.href = '{:url("index/login")}';
            }));
        }
        pending.elapsed.text(formatDuration(Date.now() - startedAt));
        if (!approvalDecision) $input.val(question);
        finish();
        if (approvalDecision) openChat(chatId);
        renderAccount();
        loadLanguageTasks();
      });
    }

    var imageExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'];

    function isImageUrl(url) {
      var ext = String(url || '').split('?')[0].split('.').pop().toLowerCase();
      return imageExts.indexOf(ext) !== -1;
    }

    function appendAttachment(url, fullurl, id) {
      var value = $.trim($input.val());
      var label = isImageUrl(url) ? '已上传图片' : '已上传文件';
      var idText = id ? '，附件ID：' + id : '';
      $input.val((value ? value + '\n' : '') + label + idText + '：' + url).focus();
      addAttachmentThumb(url, fullurl || url);
    }

    function addAttachmentThumb(url, fullurl) {
      var $wrap = $('#geo-agent-demo-attachments');
      var $item = $('<div class="geo-agent-demo__attachment"></div>');
      if (isImageUrl(url)) {
        $item.append($('<img alt="" />').attr('src', fullurl || url));
      } else {
        var name = String(url).split('?')[0].split('/').pop();
        var ext = name.split('.').pop().toLowerCase();
        var icons = { xls: 'fa-file-excel-o', xlsx: 'fa-file-excel-o', csv: 'fa-file-excel-o', doc: 'fa-file-word-o', docx: 'fa-file-word-o', pdf: 'fa-file-pdf-o' };
        $item.append($('<div class="geo-agent-demo__file"></div>')
          .attr('title', name)
          .append('<i class="fa ' + (icons[ext] || 'fa-file-o') + '"></i>')
          .append($('<span></span>').text(ext.toUpperCase())));
      }
      $item.append($('<a href="javascript:;" class="btn-remove" title="移除"></a>')
        .append('<i class="fa fa-times"></i>')
        .on('click', function () {
          $input.val(String($input.val() || '').split('\n').filter(function (line) { return line.indexOf(url) === -1; }).join('\n'));
          $item.remove();
          $wrap.toggleClass('has-items', $wrap.children().length > 0);
        }));
      $wrap.append($item).addClass('has-items');
    }

    function uploadAttachment(file) {
      if (!file) {
        return Promise.reject(new Error('没有选择文件'));
      }
      var form = new FormData();
      form.append('file', file);
      var failureMessage = '文件上传失败，请检查网络或登录状态后重试';
      // 使用公共 Ajax 流程，后台校验失败时返回 JSON，避免将错误页面当成 JSON 解析。
      return new Promise(function (resolve, reject) {
        badou.api.ajax({
          url: Config.upload.uploadurl,
          type: 'POST',
          data: form,
          processData: false,
          contentType: false,
          loading: false,
          timeout: Config.upload.timeout || 60000,
          headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' },
          // 非 JSON 响应和网络错误没有业务提示，不能直接展示 statusText。
          error: function () { reject(new Error(failureMessage)); }
        }, function (data) {
          if (!data || !data.url) {
            reject(new Error('上传结果缺少文件地址，请重试'));
          } else {
            appendAttachment(String(data.url), data.fullurl, data.id);
            resolve(data);
          }
          return false;
        }, function (data, ret) {
          var message = ret && Number(ret.code) === 0 && ret.msg
            ? String(ret.msg) : failureMessage;
          reject(new Error(message));
          return false;
        });
      });
    }

    $('#geo-agent-demo-new').on('click', function () { startedNewChat = true; openChat(0); });
    $('#geo-agent-demo-edit-cancel').on('click', function () { if (!sending) cancelMessageEdit(true); });
    if ($('#geo-agent-demo-upload').length) {
      layui.bdUpload.render({
        elem: '#geo-agent-demo-upload',
        accept: 'file',
        success: function (data) {
          var url = String(data.url || '');
          if (!url) return false;
          appendAttachment(url, data.fullurl, data.id);
          return false;
        }
      });
    }
    if ($('#geo-agent-demo-choose').length) {
      $('#geo-agent-demo-choose').on('click', function () {
        layui.badou.api.open('general.attachment/select?multiple=false', '选择附件', {
          callback: function (data) {
            var url = data && data.url ? String(data.url) : '';
            if (!url) return;
            appendAttachment(url, data.fullurl || url, data.id);
          }
        });
        return false;
      });
    }
    if (canUpload) {
      var composer = document.getElementById('geo-agent-demo-composer');
      ['dragenter', 'dragover'].forEach(function (name) {
        composer.addEventListener(name, function (event) { event.preventDefault(); composer.classList.add('is-dragover'); });
      });
      composer.addEventListener('dragleave', function (event) {
        if (!composer.contains(event.relatedTarget)) composer.classList.remove('is-dragover');
      });
      composer.addEventListener('drop', function (event) {
        event.preventDefault();
        composer.classList.remove('is-dragover');
        var files = event.dataTransfer ? Array.prototype.slice.call(event.dataTransfer.files) : [];
        files.reduce(function (chain, file) {
          return chain.then(function () {
            return uploadAttachment(file).catch(function (error) {
              badou.api.error({ message: badou.api.escape((file.name ? file.name + '：' : '') + (error.message || '上传失败')) });
            });
          });
        }, Promise.resolve());
      });
    }
    // “+” 展开上传/选附件
    $('#geo-agent-demo-add').on('click', function (event) {
      event.stopPropagation();
      $('#geo-agent-demo-approve-menu').removeClass('is-open');
      $('#geo-agent-demo-add-menu').toggleClass('is-open');
    });
    // 审批方式下拉（请求批准 / 帮我审批）
    $('#geo-agent-demo-approve-mode').on('click', function (event) {
      event.stopPropagation();
      $('#geo-agent-demo-add-menu').removeClass('is-open');
      $('#geo-agent-demo-approve-menu').toggleClass('is-open');
    });
    $('#geo-agent-demo-approve-menu button').on('click', function (event) {
      event.stopPropagation();
      var mode = $(this).data('mode') === 'auto' ? 'auto' : 'manual';
      $approveMode.data('mode', mode).attr('data-mode', mode);
      $('#geo-agent-demo-approve-label').text(mode === 'auto' ? '自动批准' : '请求批准');
      $('#geo-agent-demo-approve-menu').removeClass('is-open');
      try { localStorage.setItem(approveModeKey, mode); } catch (ignored) { }
    });
    $(document).on('click', function () {
      $('#geo-agent-demo-add-menu, #geo-agent-demo-approve-menu').removeClass('is-open');
    });
    $('#geo-agent-demo-send').on('click', function () { if (sending) stop(); else send(); });
    $messages.on('click', '.geo-agent-demo__content img', function () {
      var src = $(this).attr('src');
      if (!src) return;
      layui.layer.photos({
        photos: { title: '', data: [{ alt: $(this).attr('alt') || '', src: src }] },
        anim: 5,
        shade: 0.7
      });
    });
    $input.on('keydown', function (event) { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); } });
    showWelcome();
    loadSessions(true);
  });
</script>
