<form class="layui-form layui-row layui-col-space16">
	<div class="layui-col-md4">
		<div class="layui-input-wrap">
			<div class="layui-input-prefix">
				<i class="layui-icon layui-icon-username"></i>
			</div>
			<input type="text" name="A" value="" placeholder="Field A" class="layui-input" lay-affix="clear">
		</div>
	</div>
	<div class="layui-col-md4">
		<div class="layui-input-wrap">
			<input type="text" name="B" placeholder="Field B" lay-affix="clear" class="layui-input">
		</div>
	</div>
	<div class="layui-col-md4">
		<div class="layui-input-wrap">
			<div class="layui-input-prefix">
				<i class="layui-icon layui-icon-date"></i>
			</div>
			<input type="text" name="C" readonly placeholder="Field C" class="layui-input demo-table-search-date">
		</div>
	</div>
	<div class="layui-btn-container layui-col-xs12">
		<button class="layui-btn" lay-submit lay-filter="demo-table-search">Search</button>
		<button type="reset" class="layui-btn layui-btn-primary">Clear</button>
	</div>
</form>
<table class="layui-hide" id="ID-treeTable-demo"></table>
<script>
	layui.use(['badou'], function () {
		var bdtable = layui.bdTable;
		var treeTable = layui.treeTable;
		var layer = layui.layer;
		var dropdown = layui.dropdown;
		treeTable.render({
			elem: '#ID-treeTable-demo',
			url: "{:url('auth.rule/index')}",
			pk:'id',
			toolbar: '<div>xxx</div>',
			defaultToolbar:[
				'filter', 'exports', 'print', // 内置工具
				{
					// 扩展工具
					title: '高级搜索', // 标题
					name: 'tips', // name
					layEvent: 'LAYTABLE_TIPS', // 事件标识
					icon: 'layui-icon-search', // 图标 className
					onClick: function(obj) { // 点击事件 - 2.9.12+
						console.log(obj); // 查看返回的对象成员
					}
				}
			],
			tree:{
				customName: {
					children: 'childlist',
					pid: 'pid',
					name: 'title',
				},
				view:{
					showIcon:false
				}
			},
			cols: [[
				{type: 'checkbox'},
				{field: 'id', title: 'ID', width: 80, sort: true},
				{field: 'title', title: '标题'},
				{field: 'name', title: '规则', width: 180},
				{field: 'icon', title: '图标', width: 150, templet: bdtable.formatter.icon},
				{field: 'weigh', title: '权重', width: 100},
				{
					field: 'status', title: '状态', width: 100, selectList: {'normal': '正常', 'hidden': '隐藏'},
					custom: {'normal': "green", 'hidden': "orange"}, templet: bdtable.formatter.status
				},
				{field: 'ismenu', title: '菜单', width: 100, templet: bdtable.formatter.switch},
				{fixed: "right", title: "操作", width: 190, align: "center", templet: bdtable.formatter.operate}
			]],
		})
	});
</script>
