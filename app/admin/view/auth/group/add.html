{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}
    <div class="layui-form-item">
        <label class="layui-form-label">父级</label>
        <div class="layui-input-block">
        <select name="row[parentid]" lay-verify="required" lay-filter="parentid">
            <?php foreach ($groupdata as $key => $value): ?>
                <option value="<?php echo $key; ?>" <?php if ($key === 0) echo 'selected'; ?>>
                    <?php echo $value; ?>
                </option>
            <?php endforeach; ?>
        </select>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">权限组</label>
        <div class="layui-input-block">
            <input type="text" name="row[title]" lay-verify="required" autocomplete="off" placeholder="权限组" class="layui-input" value="">
        </div>
    </div>


    <div class="layui-form-item">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-block">
            <input type="radio" name="row[status]" value="1" title="正常" checked>
            <input type="radio" name="row[status]" value="0" title="禁用">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">权限</label>
        <div class="layui-input-block">
            <input type="checkbox" name="" title="选中全部" lay-filter="checkall">
            <input type="checkbox" name="" title="展开全部" lay-filter="expandall">
            <div id="treeview"></div>
        </div>
    </div>




    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="pear-btn pear-btn-primary pear-btn-md disabled" lay-submit>立即提交</button>
            <button type="reset" class="pear-btn pear-btn-md">重置</button>
        </div>
    </div>
</form>
<script src="__CDN__/assets/libs/jstree/jstree.min.js"></script>
<script>
// 后续使用 jstree 模块
// layui.use(['jstree'], function() {
//     var jstree = layui.jstree;
//     // 使用 jstree 功能
// });

layui.use(['badou','jquery'],function () {
        var bdForm = layui.bdForm;
        var jstree = layui.jstree;
        var $ = layui.$;


        //读取选中的条目
        $.jstree.core.prototype.get_all_checked = function(full) {
            var obj = this.get_selected(),
                i, j;
            for (i = 0, j = obj.length; i < j; i++) {
                obj = obj.concat(this.get_node(obj[i]).parents);
            }
            obj = $.grep(obj, function(v, i, a) {
                return v != '#';
            });
            obj = obj.filter(function(itm, i, a) {
                return i == a.indexOf(itm);
            });
            return full ? $.map(obj, $.proxy(function(i) {
                return this.get_node(i);
            }, this)) : obj;
        };







        bdForm.api.authGroupBindevent($("form.layui-form"));
})
</script>
