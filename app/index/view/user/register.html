<!DOCTYPE html>
<html lang="en">
{include file="user/common/head" /}
<style>
    body {
        background-color: #f0f0f0;
        /* 浅灰色背景 */
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        /* 确保body占据整个视口高度 */
    }

    .navbar {
        background-color: #fff;
        /* 白色导航栏背景 */
        border-bottom: 1px solid #e7e7e7;
    }

    .login-container {
        flex-grow: 1;
        /* 允许容器增长，将内容推到中间 */
        display: flex;
        align-items: center;
        /* 垂直居中 */
        justify-content: center;
        /* 水平居中 */
        padding: 20px;
    }

    .login-card {
        width: 100%;
        max-width: 440px;
        /* 限制卡片最大宽度 */
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.1);
        /* 柔和的阴影 */
        border: none;
        /* 移除卡片边框 */
        padding: 20px;
        background-color: #fff;
        /* 卡片背景色 */
        border-radius: 5px;
        /* 增加卡片圆角 */
    }

    .card-header {
        background-color: #fff;
        /* 卡片头部背景色 */
        border-bottom: none;
        /* 移除卡片头部底部边框 */
        padding-top: 2rem;
        /* 增加顶部内边距 */
        padding-bottom: 0;
        /* 移除底部内边距 */
    }

    .card-header h5 {
        /* 调整会员登录标题字号 */
        font-size: 1.1rem;
        /* 约17.6px */
    }

    .card-body {
        padding-top: 0;
        /* 移除卡片内容顶部内边距 */
        padding-bottom: 2rem;
        /* 增加底部内边距 */
    }

    /* Layui 表单项间距调整 */
    .layui-form-item {
        margin-bottom: 15px;
        /* 调整Layui表单项的底部间距 */
    }

    /* 调整输入框样式 */
    .layui-input {
        height: 40px;
        /* 调整输入框高度 */
        line-height: 40px;
        border-radius: 5px;
        /* 调整输入框圆角 */
        border: 1px solid #e6e6e6;
        /* 调整输入框边框颜色 */
    }

    /* 调整placeholder颜色和字号 */
    .layui-input::placeholder {
        color: #a9abb3 !important;
        /* 强制颜色生效 */
        font-size: 14px !important;
        /* 调整字号为14px */
        opacity: 1 !important;
        /* 强制透明度生效 */
    }

    /* 自定义按钮样式 */
    .btn-orange {
        background-color: #ff6900;
        border-color: #ff6900;
        color: #fff;
        font-size: 15px;
        /* 字体调整为15px */
        border-radius: 30px;
        /* 增加圆角 */
    }

    .btn-orange:hover {
        background-color: #ff6900;
        border-color: #ff6900;
        color: #fff;
    }

    .btn-light-gray {
        background-color: #f0f0f0;
        border-color: #e0e0e0;
        color: #6c757d;
        font-size: 14px;
        /* 字体调整为14px */
        border-radius: 30px;
        /* 增加圆角 */
    }

    .btn-light-gray:hover {
        background-color: #e0e0e0;
        border-color: #d0d0d0;
    }

    /* 调整记住我/忘记密码的字号和布局 */
    .layui-form-checkbox span {
        font-size: 0.875rem;
        /* 约14px */
    }

    .login-container .card-body .forget-pass {
        /* 调整忘记密码链接样式 */
        font-size: 0.875rem;
        /* 约14px */
        color: #555;
        /* 调整颜色 */
    }

    .login-container .card-body .forget-pass:hover {
        text-decoration: underline;
        /* 鼠标悬停时显示下划线 */
    }

    .layui-form-checkbox {
        margin-right: 0;
        margin-top: 0 !important;
    }

    .tab-log-verification {
        width: 100%;
        display: flex;
    }

    .verification-text {
        flex: 2;
        box-sizing: border-box;
        margin-right: 15px;
    }

    .verification-img {
        flex: 1;
        box-sizing: border-box;
        border: 1px solid #eeeeee;
        border-radius: 4px;
        height: 40px;
        width: 129px;
        overflow: hidden;
        text-align: center;
    }
    .btn-sms-send{
        border-radius: 5px;
        border:1px solid #e6e6e6;
        height: 40px;
        line-height: 40px;
    }
    .btn-sms-send:hover{
        border-color: #ff6900;
    }
</style>

<body>
    <!-- 导航栏 -->
    {include file="user/common/nav" /}

    <!-- 登录/注册容器 -->
    <div class="login-container">
        <div class="card login-card">
            <div class="card-header text-center">
                <h5 class="mb-4">会员注册</h5>
            </div>
            <div class="card-body">
                <form class="layui-form" action="{:url('index/user/register')}" method="post">
                    {:token_field()}
                    <div class="layui-form-item">
                        <div class="layui-input-wrap">
                            <div class="layui-input-prefix">
                                <i class="layui-icon layui-icon-email"></i>
                            </div>
                            <input name="email" lay-verify="required|email" placeholder="邮箱" autocomplete="off"
                                class="layui-input" />
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-input-wrap">
                            <div class="layui-input-prefix">
                                <i class="layui-icon layui-icon-username"></i>
                            </div>
                            <input name="username" lay-verify="required|username" placeholder="用户名 英文字母开头的3-16个字符"
                                autocomplete="off" class="layui-input" />
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-input-wrap">
                            <div class="layui-input-prefix">
                                <i class="layui-icon layui-icon-password"></i>
                            </div>
                            <input type="password" name="password" lay-verify="required|password"
                                placeholder="密码 6-32个字符" autocomplete="off" class="layui-input" lay-affix="eye" />
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-input-wrap">
                            <div class="layui-input-prefix">
                                <i class="layui-icon layui-icon-cellphone"></i>
                            </div>
                            <input name="mobile" lay-verify="required|phone" placeholder="手机号" autocomplete="off"
                                class="layui-input" />
                        </div>
                    </div>
                    <!--@CaptchaBegin-->
                    {if $captcha_type}
                    <div class="tab-log-verification">
                        {switch $captcha_type} {case text}
                        <div class="verification-text">
                            <div class="layui-input-wrap">
                                <div class="layui-input-prefix">
                                    <i class="layui-icon layui-icon-auz"></i>
                                </div>
                                <input name="captcha" value="" lay-verify="required" placeholder="验证码"
                                    autocomplete="off" class="layui-input" />
                            </div>
                        </div>
                        <img src="{:url('index/captcha')}?imageW=99" alt="captcha" class="verification-img" />
                        {/case} {case mobile}
                            <div class="layui-row">
                                <div class="layui-col-xs7">
                                    <div class="layui-input-wrap">
                                        <div class="layui-input-prefix">
                                            <i class="layui-icon layui-icon-auz"></i>
                                        </div>
                                        <input name="captcha" value="" lay-verify="required" placeholder="验证码"
                                            autocomplete="off" class="layui-input" />
                                    </div>
                                </div>
                                <div class="layui-col-xs5">
                                    <div style="margin-left: 15px">
                                        <button type="button" class="layui-btn layui-btn-fluid layui-btn-primary btn-sms-send btn-captcha" data-type="mobile" data-url="{:url('api/sms/send')}"
                                            >
                                            获取验证码
                                        </button>
                                    </div>
                                </div>
                            </div>
                        {/case} {/switch}
                    </div>
                    {/if}
                    <!--@CaptchaEnd-->

                    <div class="layui-form-item mt-5">
                        <button type="button" class="layui-btn layui-btn-fluid btn-orange" lay-submit
                            lay-filter="register">
                            注册
                        </button>
                    </div>
                    <div class="layui-form-item">
                        <a href="{:url('user/login')}"
                            class="layui-btn layui-btn-fluid layui-btn-primary btn-light-gray">
                            已有账号? 返回登录
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 底部 -->
    {include file="user/common/foot" /}

    <script>
        layui.use(["form", "badou", "toast"], function () {
            var form = layui.form;
            var toast = layui.toast;
            var badou = layui.badou;

            // 自定义验证规则
            form.verify({
                username: function (value, item) {
                    //value：表单的值、item：表单的DOM对象
                    // 新的用户名验证规则：以字母开头，后面跟2-15个字母、数字或下划线，总长度3-16
                    if (!new RegExp("^[a-zA-Z][a-zA-Z0-9_]{2,15}$").test(value)) {
                        return "用户名必须以字母开头，且只能包含字母、数字、下划线，长度为3-16个字符";
                    }
                },
                password: function (value, item) {
                    if (value.length < 6 || value.length > 32) {
                        return "密码必须为6到32个字符";
                    }
                },
            });

            // 刷新验证码函数
            function refreshCaptcha() {
                $(".verification-img").attr("src", "{:url('index/captcha')}?r=" + Math.random());
            }

            // 点击验证码刷新
            $(".verification-img").click(function () {
                refreshCaptcha();
            });
            // 添加回车键事件监听
            $(document).keydown(function (event) {
                if (event.keyCode === 13) {
                    $("button[lay-filter='login']").click();
                    return false;
                }
            });

            form.on("submit(register)", function (data) {
                // 注意这里是 lay-filter="register"
                badou.api.ajax(
                    {
                        url: location.href,
                        data: data.field,
                    },
                    function (ret, res) {
                        if (res.code == 1) {
                            toast.success({
                                message: res.msg,
                                timeout: 500,
                                onClosing: function () {
                                    window.location.href = res.url;
                                },
                            });
                        } else {
                            // 注册失败时刷新验证码
                            refreshCaptcha();
                        }
                        return false;
                    },
                    function (data) {
                        // 注册失败时刷新验证码
                        refreshCaptcha();
                        if (data.token) {
                            $("#token").val(data.token);
                        }
                    }
                );

                return false;
            });
        });
    </script>
</body>

</html>
