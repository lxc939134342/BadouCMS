{extend name="user/common/base" /}

{block name="main"}
<style>
    body {
        background-color: #f8f8f8;
    }
    .user-dashboard-container {
        padding-top: 30px;
        padding-bottom: 30px;
    }
    .card {
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,.05);
    }
    .card-header {
        background-color: #fff;
        border-bottom: 1px solid #eee;
        font-weight: 600;
        padding: 1rem 1.5rem;
    }
    .card-header h6 {
        font-size: 1rem;
    }
    .card-body {
        padding: 1.5rem;
    }

    .sidebar-card .card-body {
        padding-top: 2rem;
        padding-bottom: 1rem;
    }
    .sidebar-card h5 {
        font-size: 1.1rem;
    }
    .sidebar-card .list-group-item {
        border-left: 0;
        border-right: 0;
        padding: 0;
    }
    .sidebar-card .nav-link {
        padding: 12px 20px;
        color: #333;
        font-size: 14px;
        transition: all 0.2s ease-in-out;
    }
    .sidebar-card .nav-link:hover {
        background-color: #f5f5f5;
        color: #ff6c02;
    }
    .sidebar-card .nav-link.active {
        background-color: #f0f0f0;
        color: #ff6c02;
        border-left: 3px solid #ff6c02;
        font-weight: 600;
    }
    .sidebar-card .layui-icon {
        font-size: 17px;
        vertical-align: middle;
        margin-right: 8px;
    }
    .sidebar-card .badge {
        font-size: 12px;
        padding: 5px 10px;
        background-color: #f0f0f0 !important;
        color: #555 !important;
    }

    .account-info-detail p {
        margin-bottom: 0.5rem;
        font-size: 13px;
    }
    .account-info-detail .fw-bold {
        font-size: 15px;
        color: #333;
    }
    .account-info-detail .text-orange {
        color: #ff6c02 !important;
    }
    .account-info-detail .text-muted {
        color: #888 !important;
    }

    @media (min-width: 992px) {
        .col-lg-custom-sidebar {
            flex: 0 0 auto;
            width: 20%;
        }
        .col-lg-custom-main-content {
            flex: 0 0 auto;
            width: 80%;
        }
    }
</style>

<div class="container user-dashboard-container">
    <div class="row">
        {include file="user/common/left" /}

        <div class="col-12 col-lg-custom-main-content">
            <div class="card shadow-sm mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h6 class="mb-0">账户信息</h6>
                    <a href="{:url('user/profile')}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">个人资料</a>
                </div>
                <div class="card-body">
                    <div class="d-flex align-items-center mb-4">
                        <img src="{:full_url($user.avatar ? $user.avatar : '/static/images/avatar.png')}" class="rounded-circle me-3" alt="User Avatar" style="width: 60px; height: 60px;">
                        <div>
                            <h5 class="mb-0">{$user.nickname}</h5>
                        </div>
                    </div>
                    <div class="row row-cols-1 row-cols-md-2 g-3 account-info-detail">
                        <div class="col">
                            <p class="text-muted">积分</p>
                            <p class="fw-bold text-orange">{$user.score}</p>
                        </div>
                        <div class="col">
                            <p class="text-muted">余额</p>
                            <p class="fw-bold text-orange">{$user.money}</p>
                        </div>
                        <div class="col">
                            <p class="text-muted">最后登录</p>
                            <p class="fw-bold"> {$user.logintime |date="Y-m-d H:i:s"}</p>
                        </div>
                        <div class="col">
                            <p class="text-muted">最后登录IP</p>
                            <p class="fw-bold">{$user.loginip}</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
{/block}
