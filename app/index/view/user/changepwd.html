{extend name="user/common/base" /} {block name="main"}
<div class="container user-dashboard-container">
    <div class="row">
        {include file="user/common/left" /}

        <div class="col-12 col-lg-custom-main-content">
            <div class="card shadow-sm mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h6 class="mb-0">{:__('Change password')}</h6>
                </div>
                <div class="card-body">
                    <div class="col-lg-8 col-xl-6">
                        <form id="profile-form" class="layui-form" method="POST" action="">
                            {:token_field()}

                            <div class="layui-form-item">
                                <div class="layui-form-label">{:__('Old password')}:</div>
                                <div class="layui-input-block">
                                    <input
                                        type="password"
                                        class="layui-input"
                                        id="oldpassword"
                                        name="oldpassword"
                                        value=""
                                        lay-verify="required"
                                        placeholder="{:__('Old password')}" />
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-form-label">{:__('New password')}:</div>
                                <div class="layui-input-block">
                                    <input
                                        type="password"
                                        class="layui-input"
                                        id="newpassword"
                                        name="newpassword"
                                        value=""
                                        lay-verify="required"
                                        placeholder="{:__('New password')}" />
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-form-label">{:__('Renew password')}:</div>
                                <div class="layui-input-block">
                                    <input
                                        type="password"
                                        class="layui-input"
                                        id="renewpassword"
                                        name="renewpassword"
                                        value=""
                                        lay-verify="required"
                                        placeholder="{:__('Renew password')}" />
                                </div>
                            </div>

                            <div class="layui-form-item normal-footer">
                                <div class="layui-input-block">
                                    <button type="submit" lay-submit class="layui-btn layui-btn-default disabled">
                                        {:__('Ok')}
                                    </button>
                                    <button type="reset" class="layui-btn layui-btn-primary layui-border-orange">
                                        {:__('Reset')}
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    layui.use(["badou"], function () {
        var bdForm = layui.bdForm;
        var $ = layui.$;
        var badou = layui.badou;
        var toast = layui.toast;
        var form = layui.form;

        form.on("submit(changepwd)", function (data) {
            badou.api.ajax(
                {
                    url: location.href,
                    data: data.field,
                },
                function (ret, res) {
                    if (res.code == 1) {
                        toast.success({
                            message: res.msg,
                            timeout: 500,
                            onClosing: function () {
                                window.location.href = res.url;
                            },
                        });
                    } else {
                    }
                    return false;
                },
                function (data) {
                    if (data.token) {
                        $("#token").val(data.token);
                    }
                }
            );

            return false;
        });

        bdForm.api.bindevent($("form.layui-form"));
    });
</script>
{/block}
