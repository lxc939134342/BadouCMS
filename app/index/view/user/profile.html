{extend name="user/common/base" /} {block name="main"}


<div class="container user-dashboard-container">
    <div class="row">
        {include file="user/common/left" /}

        <div class="col-12 col-lg-custom-main-content">
            <div class="card shadow-sm mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h6 class="mb-0">{:__('Profile')}</h6>
                </div>
                <div class="card-body">
                    <div class="col-lg-8 col-xl-6">
                    <form
                        id="profile-form"
                        class="layui-form"
                        role="form"
                        data-toggle="validator"
                        method="POST"
                        action="{:url('api/user/profile')}">
                        {:token_field()}
                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <div class="profile-avatar-container">
                                    <img class="profile-user-img" src="{$user.avatar|cdnurl}" />
                                    <div class="profile-avatar-text">点击编辑</div>
                                    <button type="button" id="upload-avatar" class="upload" data-input-id="c-avatar">
                                        上传
                                    </button>
                                    <input type="hidden" id="c-avatar" name="avatar" value="{$user.avatar}" />
                                </div>
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <div class="layui-form-label">{:__('Username')}:</div>
                            <div class="layui-input-block">
                                <input
                                    type="text"
                                    class="layui-input"
                                    id="username"
                                    name="username"
                                    value="{$user.username|htmlentities}"
                                    data-rule="required;username;remote({:url('api/validate/checkUsernameAvailable')}, id={$user.id})"
                                    placeholder="" />
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">{:__('Nickname')}:</label>
                            <div class="layui-input-block">
                                <input
                                    type="text"
                                    class="layui-input"
                                    id="nickname"
                                    name="nickname"
                                    value="{$user.nickname|htmlentities}"
                                    data-rule="required;remote({:url('api/validate/checkNicknameAvailable')}, id={$user.id})"
                                    placeholder="" />
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">{:__('Intro')}:</label>
                            <div class="layui-input-block">
                                <input
                                    id="c-bio"
                                    data-rule=""
                                    data-tip="一句话介绍一下你自己"
                                    class="layui-input"
                                    name="bio"
                                    type="text"
                                    value="{$user.bio|htmlentities}" />
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">{:__('Email')}:</label>
                            <div class="layui-input-block">
                                <div class="layui-input-group">
                                    <input
                                        type="text"
                                        class="layui-input"
                                        id="c-email"
                                        name="email"
                                        value="{$user.email|htmlentities}"
                                        disabled
                                        placeholder="" />
                                    <div class="layui-input-suffix">
                                        <a
                                            href="javascript:;"
                                            class="layui-btn layui-btn-primary layui-border-orange btn-change"
                                            data-type="email">
                                            {:__('Change')}
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">{:__('Mobile')}:</label>
                            <div class="layui-input-block">
                                <div class="layui-input-group">
                                    <input
                                        type="text"
                                        class="layui-input"
                                        id="c-mobile"
                                        name="mobile"
                                        value="{$user.mobile|htmlentities}"
                                        disabled
                                        placeholder="" />
                                    <div class="layui-input-suffix">
                                        <a
                                            href="javascript:;"
                                            class="layui-btn layui-btn-primary layui-border-orange btn-change"
                                            data-type="mobile">
                                            {:__('Change')}
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="layui-form-item normal-footer">
                            <div class="layui-input-block">
                                <button type="submit" class="layui-btn layui-btn-default disabled">
                                    {:__('Ok')}
                                </button>
                                <button type="reset" class="layui-btn layui-btn-primary layui-border-orange">{:__('Reset')}</button>
                            </div>
                        </div>
                    </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="emailtpl">
    <form id="email-form" class="layui-form form-layer" method="POST" action="{:url('api/user/changeemail')}">
        <div class="form-body">
            <input type="hidden" name="action" value="changeemail" />
            <div class="layui-form-item">
                <label class="layui-form-label">{:__('New Email')}:</label>
                <div class="layui-input-block">
                    <input
                        type="text"
                        class="layui-input"
                        id="email"
                        name="email"
                        value=""
                        lay-verify="required|email"
                        placeholder="{:__('New email')}" />
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">{:__('Captcha')}:</label>
                <div class="layui-input-block">
                    <div class="layui-input-group">
                        <input
                            type="text"
                            name="captcha"
                            id="email-captcha"
                            class="layui-input"
                            lay-verify="required"
                            placeholder="{:__('Captcha')}"
                            />
                        <div class="layui-input-suffix">
                            <a
                                href="javascript:;"
                                class="layui-btn layui-border-orange layui-btn-primary btn-captcha"
                                data-url="{:url('api/ems/send')}"
                                data-type="email"
                                data-event="changeemail">
                                获取验证码
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-footer">
            <div class="layui-form-item" style="margin-bottom:0;">
                <div class="layui-input-block" style="margin-left: 120px;">
                    <button type="submit" lay-submit lay-filter="email" class="layui-btn  layui-btn-default">
                        {:__('Submit')}
                    </button>
                </div>
            </div>
        </div>
    </form>
</script>
<script type="text/html" id="mobiletpl">
    <form id="mobile-form" class="layui-form form-layer" method="POST" action="{:url('api/user/changemobile')}">
        <div class="form-body">
            <input type="hidden" name="action" value="changemobile" />
            <div class="layui-form-item">
                <label class="layui-form-label">{:__('New mobile')}:</label>
                <div class="layui-input-block">
                    <input
                        type="text"
                        class="layui-input"
                        id="mobile"
                        name="mobile"
                        lay-verify="required|mobile"
                        value=""
                        placeholder="{:__('New mobile')}" />
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">{:__('Captcha')}:</label>
                <div class="layui-input-block">
                    <div class="layui-input-group">
                        <input
                            type="text"
                            name="captcha"
                            id="mobile-captcha"
                            class="layui-input"
                            placeholder="{:__('Captcha')}"
                             />
                        <div class="layui-input-suffix">
                            <a
                                href="javascript:;"
                                class="layui-btn layui-btn-primary layui-border-orange btn-captcha"
                                data-url="{:url('api/sms/send')}"
                                data-type="mobile"
                                data-event="changemobile">
                                获取验证码
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-footer">
            <div class="layui-form-item" style="margin-bottom:0;">
                <div class="layui-input-block" style="margin-left: 120px;">
                    <button type="submit" class="layui-btn layui-btn-primary layui-border-orange">
                        {:__('Submit')}
                    </button>
                </div>
            </div>
        </div>
    </form>
</script>

<script>
    layui.use(["badou", "upload", "laytpl", "layer","bdForm"], function () {
        var badou = layui.badou;
        var toast = layui.toast;
        var form = layui.form;
        var upload = layui.upload;
        var laytpl = layui.laytpl;
        var layer = layui.layer;
        var bdForm = layui.bdForm;

        $(document).on("click", ".btn-change", function () {
            var that = this;
            var id = $(this).data("type") + "tpl";
            var template = document.getElementById(id).innerHTML;
            var content = laytpl(template, {}).render();
            layer.open({
                type: 1,
                title: "修改",
                area: [$(window).width() < 450 ? $(window).width() - 10 + "px" : "450px", "355px"],
                content: content,
                success: function (layero, index) {
                    var form = $("form", layero);
                    bdForm.api.bindevent(form,function (data) {
                        location.reload();
                        Layer.closeAll();
                    });
                },
            });
        });

        upload.render({
            elem: "#upload-avatar",
            url: "{:url('api/ajax/upload')}",
            done: function (res) {
                if (res.code == 1) {
                    $("#c-avatar").val(res.data.url);
                    $(".profile-user-img").attr("src", res.data.fullurl);
                } else {
                    layer.msg(res.msg, { icon: 2, time: 1000 });
                }
            },
        });
        bdForm.api.bindevent($("form.layui-form"));
    });
</script>
{/block}
