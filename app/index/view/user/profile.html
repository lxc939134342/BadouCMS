{extend name="user/common/base" /} {block name="main"}
<style>
    body {
        background-color: #f8f8f8;
    }
    .user-dashboard-container {
        padding-top: 30px;
        padding-bottom: 30px;
    }
    .card {
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }
    .card-header {
        background-color: #fff;
        border-bottom: 1px solid #eee;
        font-weight: 600;
        padding: 1rem 1.5rem;
    }
    .card-header h6 {
        font-size: 1rem;
    }
    .card-body {
        padding: 1.5rem;
    }

    .sidebar-card .card-body {
        padding-top: 2rem;
        padding-bottom: 1rem;
    }
    .sidebar-card h5 {
        font-size: 1.1rem;
    }
    .sidebar-card .list-group-item {
        border-left: 0;
        border-right: 0;
        padding: 0;
    }
    .sidebar-card .nav-link {
        padding: 12px 20px;
        color: #333;
        font-size: 14px;
        transition: all 0.2s ease-in-out;
    }
    .sidebar-card .nav-link:hover {
        background-color: #f5f5f5;
        color: #ff6c02;
    }
    .sidebar-card .nav-link.active {
        background-color: #f0f0f0;
        color: #ff6c02;
        border-left: 3px solid #ff6c02;
        font-weight: 600;
    }
    .sidebar-card .layui-icon {
        font-size: 17px;
        vertical-align: middle;
        margin-right: 8px;
    }
    .sidebar-card .badge {
        font-size: 12px;
        padding: 5px 10px;
        background-color: #f0f0f0 !important;
        color: #555 !important;
    }

    .account-info-detail p {
        margin-bottom: 0.5rem;
        font-size: 13px;
    }
    .account-info-detail .fw-bold {
        font-size: 15px;
        color: #333;
    }
    .account-info-detail .text-orange {
        color: #ff6c02 !important;
    }
    .account-info-detail .text-muted {
        color: #888 !important;
    }

    @media (min-width: 992px) {
        .col-lg-custom-sidebar {
            flex: 0 0 auto;
            width: 20%;
        }
        .col-lg-custom-main-content {
            flex: 0 0 auto;
            width: 80%;
        }
    }

    .profile-avatar-container {
        position: relative;
        width: 100px;
    }
    .profile-avatar-container .profile-user-img {
        width: 100px;
        height: 100px;
    }
    .profile-avatar-container .profile-avatar-text {
        display: none;
    }
    .profile-avatar-container:hover .profile-avatar-text {
        display: block;
        position: absolute;
        height: 100px;
        width: 100px;
        background: #444;
        opacity: 0.6;
        color: #fff;
        top: 0;
        left: 0;
        line-height: 100px;
        text-align: center;
    }
    .profile-avatar-container button {
        position: absolute;
        top: 0;
        left: 0;
        width: 100px;
        height: 100px;
        opacity: 0 !important;
    }
    .layui-input-group > .layui-input-prefix {
        width: 120px;
    }

    .layui-btn-default{
        background-color: #ff6c02;
    }
    .layui-border-orange{
        border-color: #ff6c02 !important;
        color: #ff6c02 !important;
    }
</style>

<div class="container user-dashboard-container">
    <div class="row">
        {include file="user/common/left" /}

        <div class="col-12 col-lg-custom-main-content">
            <div class="card shadow-sm mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h6 class="mb-0">{:__('Profile')}</h6>
                </div>
                <div class="card-body">
                    <form
                        id="profile-form"
                        class="form-horizontal layui-form"
                        role="form"
                        data-toggle="validator"
                        method="POST"
                        action="{:url('api/user/profile')}">
                        {:token_field()}
                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <div class="profile-avatar-container">
                                    <img class="profile-user-img" src="{$user.avatar|cdnurl}" />
                                    <div class="profile-avatar-text">点击编辑</div>
                                    <button type="button" id="upload-avatar" class="upload" data-input-id="c-avatar">
                                        上传
                                    </button>
                                    <input type="hidden" id="c-avatar" name="avatar" value="{$user.avatar}" />
                                </div>
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <div class="layui-input-group">
                                <div class="layui-input-prefix">{:__('Username')}:</div>
                                <input
                                    type="text"
                                    class="layui-input"
                                    id="username"
                                    name="username"
                                    value="{$user.username|htmlentities}"
                                    data-rule="required;username;remote({:url('api/validate/check_username_available')}, id={$user.id})"
                                    placeholder="" />
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-input-group">
                                <div class="layui-input-prefix">{:__('Nickname')}:</div>
                                <input
                                    type="text"
                                    class="layui-input"
                                    id="nickname"
                                    name="nickname"
                                    value="{$user.nickname|htmlentities}"
                                    data-rule="required;remote({:url('api/validate/check_nickname_available')}, id={$user.id})"
                                    placeholder="" />
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-input-group">
                                <div class="layui-input-prefix">{:__('Intro')}:</div>
                                <input
                                    id="c-bio"
                                    data-rule=""
                                    data-tip="一句话介绍一下你自己"
                                    class="layui-input"
                                    name="bio"
                                    type="text"
                                    value="{$user.bio|htmlentities}" />
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-input-group">
                                <div class="layui-input-prefix">{:__('Email')}:</div>
                                <input
                                    type="text"
                                    class="layui-input"
                                    id="c-email"
                                    name="email"
                                    value="{$user.email|htmlentities}"
                                    disabled
                                    placeholder="" />
                                <div class="layui-input-suffix">
                                    <a
                                        href="javascript:;"
                                        class="layui-btn layui-btn-primary layui-border-orange btn-change"
                                        data-type="email">
                                        {:__('Change')}
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-input-group">
                                <div class="layui-input-prefix">{:__('Mobile')}:</div>
                                <input
                                    type="text"
                                    class="layui-input"
                                    id="c-mobile"
                                    name="mobile"
                                    value="{$user.mobile|htmlentities}"
                                    disabled
                                    placeholder="" />
                                <div class="layui-input-suffix">
                                    <a
                                        href="javascript:;"
                                        class="layui-btn layui-btn-primary layui-border-orange btn-change"
                                        data-type="mobile">
                                        {:__('Change')}
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="layui-input-group normal-footer">
                            <label class="layui-input-prefix col-xs-12 col-sm-2"></label>
                            <div class="col-xs-12 col-sm-8">
                                <button type="submit" class="layui-btn layui-btn-primary layui-border-orange disabled">
                                    {:__('Ok')}
                                </button>
                                <button type="reset" class="layui-btn layui-btn-default">{:__('Reset')}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="emailtpl">
    <form id="email-form" class="form-horizontal form-layer " method="POST" action="{:url('api/user/changeemail')}">
        <div class="form-body">
            <input type="hidden" name="action" value="changeemail" />
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-3">{:__('New Email')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input
                        type="text"
                        class="form-control"
                        id="email"
                        name="email"
                        value=""
                        data-rule="required;email;remote({:url('api/validate/check_email_available')}, event=changeemail, id={$user.id})"
                        placeholder="{:__('New email')}" />
                    <span class="msg-box"></span>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-3">{:__('Captcha')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <div class="input-group">
                        <input
                            type="text"
                            name="captcha"
                            id="email-captcha"
                            class="form-control"
                            data-rule="required;length({$Think.config.captcha.length});digits;remote({:url('api/validate/check_ems_correct')}, event=changeemail, email:#email)" />
                        <span class="input-group-btn" style="padding:0;border:none;">
                            <a
                                href="javascript:;"
                                class="btn btn-info btn-captcha"
                                data-url="{:url('api/ems/send')}"
                                data-type="email"
                                data-event="changeemail">
                                获取验证码
                            </a>
                        </span>
                    </div>
                    <span class="msg-box"></span>
                </div>
            </div>
        </div>
        <div class="form-footer">
            <div class="form-group" style="margin-bottom:0;">
                <div class="col-xs-12 col-sm-8 col-sm-offset-3">
                    <button type="submit" class="btn btn-md btn-primary">{:__('Submit')}</button>
                </div>
            </div>
        </div>
    </form>
</script>
<script type="text/html" id="mobiletpl">
    <form id="mobile-form" class="form-horizontal form-layer" method="POST" action="{:url('api/user/changemobile')}">
        <div class="form-body">
            <input type="hidden" name="action" value="changemobile" />
            <div class="form-group">
                <label for="c-mobile" class="control-label col-xs-12 col-sm-3">{:__('New mobile')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input
                        type="text"
                        class="form-control"
                        id="mobile"
                        name="mobile"
                        value=""
                        data-rule="required;mobile;remote({:url('api/validate/check_mobile_available')}, event=changemobile, id={$user.id})"
                        placeholder="{:__('New mobile')}" />
                    <span class="msg-box"></span>
                </div>
            </div>
            <div class="form-group">
                <label for="mobile-captcha" class="control-label col-xs-12 col-sm-3">{:__('Captcha')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <div class="input-group">
                        <input
                            type="text"
                            name="captcha"
                            id="mobile-captcha"
                            class="form-control"
                            data-rule="required;length({$Think.config.captcha.length});digits;remote({:url('api/validate/check_sms_correct')}, event=changemobile, mobile:#mobile)" />
                        <span class="input-group-btn" style="padding:0;border:none;">
                            <a
                                href="javascript:;"
                                class="btn btn-info btn-captcha"
                                data-url="{:url('api/sms/send')}"
                                data-type="mobile"
                                data-event="changemobile">
                                获取验证码
                            </a>
                        </span>
                    </div>
                    <span class="msg-box"></span>
                </div>
            </div>
        </div>
        <div class="form-footer">
            <div class="form-group" style="margin-bottom:0;">
                <div class="col-xs-12 col-sm-8 col-sm-offset-3">
                    <button type="submit" class="btn btn-md btn-primary">{:__('Submit')}</button>
                </div>
            </div>
        </div>
    </form>
</script>
<style>
    .form-layer {
        height: 100%;
        min-height: 150px;
        min-width: 300px;
    }
    .form-body {
        width: 100%;
        overflow: auto;
        top: 0;
        position: absolute;
        z-index: 10;
        bottom: 50px;
        padding: 15px;
    }
    .form-layer .form-footer {
        height: 50px;
        line-height: 50px;
        background-color: #ecf0f1;
        width: 100%;
        position: absolute;
        z-index: 200;
        bottom: 0;
        margin: 0;
    }
    .form-footer .form-group {
        margin-left: 0;
        margin-right: 0;
    }
</style>

<script>
    layui.use(["badou", "upload",'laytpl'], function () {
        var bdForm = layui.bdForm;
        var $ = layui.$;
        var badou = layui.badou;
        var toast = layui.toast;
        var form = layui.form;
        var upload = layui.upload;
        var laytpl = layui.laytpl;

        $(document).on("click", ".btn-change", function () {
            var that = this;
            var id = $(this).data("type") + "tpl";
            var content = laytpl(id, {});
            layer.open({
                type: 1,
                title: "修改",
                area: [$(window).width() < 450 ? ($(window).width() - 10) + "px" : "450px", "355px"],
                content: content,
                success: function (layero) {
                    var form = $("form", layero);
                    bdForm.api.bindevent(form, function (data) {
                        location.reload();
                        layer.closeAll();
                    });
                }
            });
        });

        upload.render({
            elem: "#upload-avatar",
            url: "{:url('api/ajax/upload')}",
            done: function (res) {
                if (res.code == 1) {
                    $("#c-avatar").val(res.data.url);
                    $(".profile-user-img").attr("src", res.data.fullurl);
                } else {
                    layer.msg(res.msg, { icon: 2, time: 1000 });
                }
            },
        });


        bdForm.api.bindevent($("form.layui-form"));
    });
</script>
{/block}
