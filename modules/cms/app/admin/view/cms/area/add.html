{layout name="layout/form" /}
<form class="layui-form" method="post">
    {:token_field()}
    <div class="layui-form-item">
        <label class="layui-form-label">区域编码</label>
        <div class="layui-input-block">
            <input type="text" name="row[acode]" value="" required  lay-verify="required" placeholder="请输入区域编码" autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">区域名称</label>
        <div class="layui-input-block">
            <input type="text" name="row[name]" value="" required  lay-verify="required" placeholder="请输入区域名称" autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">绑定域名</label>
        <div class="layui-input-block">
            <input type="text" name="row[domain]" value="" placeholder="请输入绑定域名" autocomplete="off" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">状态 </label>
        <div class="layui-input-block">
            <input type="radio" name="row[is_default]" value="1" title="是" >
            <input type="radio" name="row[is_default]" value="0" title="否" checked>
        </div>
    </div>

    <div class="layui-form-item layer-footer hide">
        <div class="layui-input-block">
            <button class="layui-btn btn-theme-color disabled" lay-submit>立即提交</button>
            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
    </div>
</form>

<script>
    layui.use(['badou'],function () {
        var bdForm = layui.bdForm;
        bdForm.api.bindevent($("form.layui-form"));
    })
</script>
