server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;
    client_max_body_size 40m;

    # AI 使用 SSE 输出，不能等待攒满缓冲后才显示回答。
    gzip off;

    location / {
        try_files $uri $uri/ /index.php?s=$uri&$query_string;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    # 上传目录只提供附件下载，不能作为 PHP 入口。
    location ~* ^/uploads/.*\.(?:php[0-9]*|phtml|phar)(?:/|$) {
        deny all;
    }

    location ~ ^(.+\.php)(/.*)?$ {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        set $saved_path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $saved_path_info;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }
}
