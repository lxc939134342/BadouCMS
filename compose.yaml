name: badoucms

x-php: &php
  image: badoucms-php:8.4
  build:
    context: ./deploy/docker
  working_dir: /var/www/html
  volumes:
    - ./:/var/www/html
  environment:
    TZ: Asia/Shanghai
  init: true
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  php:
    <<: *php

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
    logging: *logging

  mysql:
    image: mysql:8.4
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-badouadmin}
      MYSQL_USER: ${MYSQL_USER:-badouadmin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/docker/.env 中设置数据库密码}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/docker/.env 中设置数据库 root 密码}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  worker:
    <<: *php
    profiles: [cli]
    user: www-data
    command: ["php", "think", "agent:task", "--watch"]
    stop_grace_period: 300s

volumes:
  mysql-data:
