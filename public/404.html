<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background-color: #f8f9fa;
            color: #6c757d;
            text-align: center;
            padding: 50px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 120px;
            margin: 0;
            font-weight: 900;
            color: #dee2e6;
            text-shadow: 4px 4px 0 #fff, 6px 6px 0 #dee2e6;
        }
        h2 {
            font-size: 2em;
            margin-top: 0;
            color: #ff6c02;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        a {
            color: #212529;
            text-decoration: none;
            border: 1px solid #212529;
            padding: 10px 20px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        a:hover {
            background-color: #212529;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>页面未找到</h2>
        <p>抱歉，您要查找的页面去旅游啦！暂时无法找打它 ^_^ </p>
        <p><a href="/">返回首页</a></p>
    </div>
</body>
</html>
